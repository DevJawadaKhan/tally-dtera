<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1d21">
<title>Tally mobile — prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f2ee; --card:#ffffff; --card-2:#f8f7f4; --ink:#1b1d21; --ink-2:#3a3d44; --muted:#6f737b; --line:#e6e3dc; --line-2:#efede8;
  --g:#1f6f54; --g2:#e3f1ea; --g3:#2f8c69; --amber:#9a6408; --amber-bg:#fbf0d9; --amber-m:#d99a1e; --red:#b4321f; --red-bg:#fbe6e1; --red-m:#d03b3b;
  --blue:#2a78d6; --violet:#6250d6; --dark:#1b1d21;
  --font:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:var(--font);color:var(--ink);background:#d9d6ce;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* stage: phone frame on desktop, full-bleed on phones */
.stage{min-height:100%;display:flex;align-items:center;justify-content:center;gap:48px;padding:32px}
.side-note{max-width:300px}
.side-note h1{font-size:22px;margin:0 0 6px}
.side-note p{color:#5b5e65;margin:0 0 16px;font-size:14px}
.side-note .jump{display:grid;gap:6px}
.side-note .jump button{text-align:start;border:1px solid #c9c5bb;background:#efece6;border-radius:10px;padding:8px 12px;font-size:13.5px}
.side-note .jump button:hover{background:#fff}
.side-note h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#6f737b;margin:18px 0 8px}
.phone{width:390px;height:844px;border-radius:54px;background:#0e0f11;padding:12px;box-shadow:0 30px 80px rgba(0,0,0,.25),inset 0 0 0 2px #2a2c30;position:relative;flex:none}
.screen{width:100%;height:100%;border-radius:43px;overflow:hidden;background:var(--bg);position:relative;display:flex;flex-direction:column}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;border-radius:20px;background:#000;z-index:50}
.statusbar{height:50px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 6px;font-size:14px;font-weight:600;z-index:40}
.statusbar.dark{background:var(--dark);color:#fff}
@media (max-width:520px){
  body{background:var(--bg)}
  .stage{padding:0;display:block}
  .side-note{display:none}
  .phone{width:100%;height:100dvh;border-radius:0;padding:0;box-shadow:none;background:var(--bg)}
  .screen{border-radius:0}
  .island,.statusbar{display:none}
  .app-top{padding-top:calc(12px + env(safe-area-inset-top))!important}
}

/* app chrome */
.app-top{flex:none;padding:6px 20px 12px;display:flex;align-items:center;gap:12px}
.app-top.dark{background:var(--dark);color:#fff;padding-bottom:18px}
.app-top h1{font-size:24px;font-weight:700;margin:0;letter-spacing:-.02em;flex:1}
.app-top .sub{font-size:13px;color:var(--muted)}
.app-top.dark .sub{color:#9a9890}
.scroll{flex:1;overflow-y:auto;padding:0 16px 110px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.tabs{position:absolute;left:0;right:0;bottom:0;z-index:30;display:flex;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:8px 6px calc(22px + env(safe-area-inset-bottom))}
.tabs button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:500;color:#8b8e95;padding:4px 0;position:relative}
.tabs button[aria-current=page]{color:var(--g)}
.tabs .badge{position:absolute;top:0;left:calc(50% + 6px);background:var(--red-m);color:#fff;font-size:10px;font-family:var(--mono);border-radius:99px;min-width:16px;height:16px;display:grid;place-items:center;padding:0 4px}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;font-size:13px;flex:none}
.av.s{width:28px;height:28px;font-size:11px}
.av.l{width:64px;height:64px;font-size:22px}
.icon-btn{width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.05);display:grid;place-items:center;position:relative}
.app-top.dark .icon-btn{background:rgba(255,255,255,.1);color:#fff}
.icon-btn .dotc{position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--red-m);border:2px solid var(--dark)}

/* cards & bits */
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card h2{font-size:15px;font-weight:600;margin:0}
.card .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
.card .hd a{font-size:13px;color:var(--g);font-weight:500;cursor:pointer}
.muted{color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:7px;background:var(--line-2);color:var(--ink-2);white-space:nowrap}
.tag.g{background:var(--g2);color:var(--g)} .tag.a{background:var(--amber-bg);color:var(--amber)} .tag.r{background:var(--red-bg);color:var(--red)} .tag.b{background:#e5eefb;color:var(--blue)}
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--line-2);color:var(--ink)}
.btn.p{background:var(--g);color:#fff}
.btn.dk{background:var(--dark);color:#fff}
.btn.w{width:100%}
.btn.sm{padding:8px 12px;font-size:13.5px;border-radius:11px}
.btn.out{background:transparent;border:1.5px solid var(--line)}
.btn.red{background:var(--red-bg);color:var(--red)}
.btn:active{transform:scale(.98)}
.seg{display:flex;background:var(--line-2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 6px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line-2)}
.row:first-child{border-top:0;padding-top:2px}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:500;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12.5px;color:var(--muted)}
.key{font-family:var(--mono);font-size:11.5px;color:var(--blue)}
.code{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 13px;font-size:13px;font-weight:500}
.chips button[aria-pressed=true]{background:var(--dark);color:#fff;border-color:var(--dark)}
.alert{border-radius:16px;padding:12px 14px;display:flex;gap:10px;align-items:center;margin-bottom:12px;font-size:13.5px}
.alert.r{background:var(--red-bg);color:var(--red)} .alert.a{background:var(--amber-bg);color:var(--amber)}
.alert .grow{flex:1}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--g3);display:inline-block;animation:pulse 1.4s infinite;flex:none}
@keyframes pulse{50%{opacity:.25}}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}

/* hero check-in */
.hero{background:var(--dark);color:#fff;border-radius:26px;padding:18px;margin-bottom:12px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(47,140,105,.45),transparent 70%)}
.hero .lbl{font-size:12.5px;color:#9a9890;display:flex;align-items:center;gap:8px}
.hero .big{font-family:var(--mono);font-size:44px;font-weight:500;letter-spacing:-.03em;margin:4px 0 2px;line-height:1.1}
.hero .meta{font-size:13px;color:#c9c7c1;display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.hero .seg{background:rgba(255,255,255,.08);margin-bottom:12px}
.hero .seg button{color:#9a9890}
.hero .seg button[aria-pressed=true]{background:#fff;color:var(--ink)}
.slide{position:relative;height:58px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;user-select:none;touch-action:none}
.slide .knob{position:absolute;top:5px;left:5px;width:48px;height:48px;border-radius:50%;background:var(--g3);display:grid;place-items:center;color:#fff;z-index:2;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.slide .txt{position:absolute;inset:0;display:grid;place-items:center;font-weight:600;font-size:15px;color:#e8e6e1;letter-spacing:.01em}
.slide .fill{position:absolute;left:0;top:0;bottom:0;background:rgba(47,140,105,.35);border-radius:99px}
.slide.out .knob{background:#fff;color:var(--ink)}

/* timer card */
.timer{display:flex;align-items:center;gap:14px}
.timer .clk{font-family:var(--mono);font-size:28px;font-weight:500;letter-spacing:-.02em}
.round{width:52px;height:52px;border-radius:50%;border:0;display:grid;place-items:center;flex:none}
.round.p{background:var(--g);color:#fff}
.round.stop{background:var(--red-m);color:#fff}
.ring{position:relative;width:92px;height:92px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
.ring .c b{font-family:var(--mono);font-size:20px}
.ring .c small{font-size:11px;color:var(--muted)}
.hscroll{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.tcard{flex:none;width:220px;background:var(--card-2);border:1px solid var(--line-2);border-radius:16px;padding:12px;display:grid;gap:6px}
.tcard .tt{font-weight:500;font-size:14px;line-height:1.3;height:36px;overflow:hidden}
.bar{height:6px;border-radius:99px;background:var(--line-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--blue)}
.week{display:flex;align-items:flex-end;gap:8px;height:90px;padding-top:6px}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.week i{width:100%;max-width:26px;border-radius:6px 6px 3px 3px;background:var(--g);display:block}
.week i.p{background:var(--amber-m)} .week i.e{background:var(--line)}
.week span{font-size:11px;color:var(--muted);font-family:var(--mono)}
.week div.today span{color:var(--ink);font-weight:600}

/* log */
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.days button{flex:none;width:52px;border:0;background:var(--card);border-radius:14px;padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:2px}
.days button small{font-size:11px;color:var(--muted)}
.days button b{font-size:17px}
.days button i{width:6px;height:6px;border-radius:50%;background:transparent}
.days button[aria-pressed=true]{background:var(--dark);color:#fff}
.days button[aria-pressed=true] small{color:#9a9890}
.fab{position:absolute;right:20px;bottom:104px;width:58px;height:58px;border-radius:18px;border:0;background:var(--g);color:#fff;display:grid;place-items:center;box-shadow:0 10px 24px rgba(31,111,84,.35);z-index:25}
.st{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px}
.st.draft{background:var(--line-2);color:var(--ink-2)} .st.pending{background:var(--amber-bg);color:var(--amber)} .st.approved{background:var(--g2);color:var(--g)} .st.rejected{background:var(--red-bg);color:var(--red)}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal .h{font-size:11px;color:var(--muted);padding-bottom:2px}
.cal button{aspect-ratio:1;border:0;border-radius:12px;background:var(--card-2);font-size:13px;font-family:var(--mono);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0}
.cal button .dot{width:6px;height:6px}
.cal button.sel{background:var(--dark);color:#fff}
.cal button.we{background:transparent;color:#b5b2aa}
.cal button.fut{background:transparent;color:#c7c4bc}
.tl{position:relative;height:14px;border-radius:7px;background:var(--line-2);margin:10px 0 4px}
.tl i{position:absolute;top:0;bottom:0;border-radius:7px;background:var(--g)}
.tl i.open{background:repeating-linear-gradient(45deg,var(--g),var(--g) 4px,var(--g2) 4px,var(--g2) 8px)}
.tl-l{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);font-family:var(--mono)}

/* sheets */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:61;background:var(--bg);border-radius:26px 26px 0 0;padding:8px 18px calc(26px + env(safe-area-inset-bottom));max-height:88%;overflow-y:auto;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:#cfccc4;margin:4px auto 12px}
.sheet h3{font-size:19px;margin:0 0 4px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.inp{width:100%;border:1px solid var(--line);background:var(--card);border-radius:13px;padding:12px 13px;font-size:15px}
.inp:focus{outline:2px solid var(--g);border-color:transparent}
.stepper{display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:13px;overflow:hidden}
.stepper button{width:56px;height:50px;border:0;background:transparent;font-size:22px;color:var(--muted)}
.stepper b{flex:1;text-align:center;font-family:var(--mono);font-size:20px}
.pick{display:grid;gap:8px}
.pick button{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:11px 12px;text-align:start;display:flex;gap:10px;align-items:center}
.pick button[aria-pressed=true]{border-color:var(--g);background:var(--g2)}
.toast{position:absolute;left:50%;bottom:110px;transform:translate(-50%,12px);background:var(--dark);color:#fff;padding:10px 16px;border-radius:14px;font-size:13.5px;z-index:80;opacity:0;transition:.2s;white-space:nowrap;pointer-events:none;max-width:90%;overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* approvals */
.apr{background:var(--card);border-radius:20px;padding:14px;margin-bottom:12px}
.apr .top{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.apr .top .grow{flex:1;min-width:0}
.apr .ln{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:7px 0;border-top:1px solid var(--line-2)}
.apr .acts{display:grid;grid-template-columns:1fr 1.4fr;gap:8px;margin-top:10px}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat3 div{background:var(--card);border-radius:16px;padding:12px}
.stat3 b{display:block;font-family:var(--mono);font-size:22px}
.stat3 span{font-size:12px;color:var(--muted)}

/* sign in */
.signin{flex:1;display:flex;flex-direction:column;background:var(--dark);color:#fff;padding:24px 22px calc(28px + env(safe-area-inset-bottom))}
.signin .logo{width:60px;height:60px;border-radius:18px;background:var(--g3);display:grid;place-items:center;margin:30px 0 20px}
.signin h1{font-size:32px;line-height:1.15;margin:0 0 10px;letter-spacing:-.02em}
.signin p{color:#a9a7a0;margin:0 0 auto}
.signin .btn{margin-top:10px}
.signin .ms{background:#fff;color:var(--ink)}
.signin .demo{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.signin .demo button{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff;border-radius:14px;padding:12px;text-align:start}
.signin .demo small{display:block;color:#9a9890;font-size:12px}
.signin .fine{font-size:12px;color:#7d7b76;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="stage">
  <div class="side-note">
    <h1>Tally mobile</h1>
    <p>Clickable prototype of the DTERA field app. Three roles: engineers check in and run timers, supervisors approve, admins watch budgets, attendance and access requests. Data resets when you reload.</p>
    <h3>Jump to</h3>
    <div class="jump" id="jump"></div>
  </div>
  <div class="phone"><div class="island"></div><div class="screen" id="screen"></div></div>
</div>

<script>
(() => {
/* ---------- data ---------- */
const COLORS = {e1:"#7a3e8e", e2:"#a2611b", e3:"#2c7a87", e4:"#9b3d52", e5:"#4d6b2e", e6:"#5a5f9e", e7:"#7d5a32", e8:"#36728f", e9:"#8d4a73", u1:"#1f6f54", u2:"#8a4b2a", u3:"#3b5ba5"};
const PEOPLE = {
  e1:{name:"Ahmed Khan", title:"Commissioning Engineer"}, e3:{name:"Faisal Al-Qahtani", title:"Telecom Technician"},
  e7:{name:"Rahul Menon", title:"Electrical Technician"}, e9:{name:"Yusuf Ali", title:"Commissioning Engineer"},
  u3:{name:"Omar Siddiqui", title:"Commissioning Manager"}, u1:{name:"Huda Al-Harbi", title:"HR Manager"}, u2:{name:"Lina Haddad", title:"Design Manager"},
  e2:{name:"Daniel Okafor", title:"Electrical Design Engineer"}, e4:{name:"Khalid Rahman", title:"HR Officer"}, e5:{name:"Mariam Saeed", title:"CAD Draftsperson"},
  e6:{name:"Noura Al-Otaibi", title:"Procurement Specialist"}, e8:{name:"Sara Mahmoud", title:"Design Engineer"}
};
const PROJ = {p1:{code:"NET-01", name:"Utility WAN Upgrade", c:"#2a78d6"}, p3:{code:"SCD-02", name:"SCADA Pump Stations", c:"#1baf7a"}, p4:{code:"P5G-07", name:"Private 5G Campus", c:"#eda100"}, p0:{code:"OVH-00", name:"Internal / Overhead", c:"#9b9890"}};
const now = new Date(), pad = n => String(n).padStart(2,"0"), hm = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addD = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const fmt = (d, o) => new Intl.DateTimeFormat("en-GB", o).format(d);
const TODAY = iso(now);
const isWE = d => d.getDay() === 5 || d.getDay() === 6;
const lastWork = (() => { let d = addD(now, -1); while (isWE(d)) d = addD(d, -1); return d; })();

const S = {
  screen:"signin", role:"eng", me:"e1", sheet:null, loc:"site", day:TODAY, tf:"all", calSel:TODAY, flt:"all",
  att:{ sessions:[], missed:{date:iso(lastWork), in:"07:48"} },
  timer:null,
  tickets:[
    {id:"t1", key:"NET-105", p:"p1", title:"Firewall policy review", status:"doing", pri:"High", est:24, logged:15, due:addD(now,2), comments:[{by:"u3", text:"Please finish before Thursday's change window.", at:"Yesterday"}]},
    {id:"t2", key:"NET-103", p:"p1", title:"Substation RTU connectivity test", status:"todo", pri:"Normal", est:16, logged:0, due:addD(now,6), comments:[]},
    {id:"t3", key:"SCD-101", p:"p3", title:"PLC panel FAT — Pump Station 4", status:"review", pri:"Urgent", est:20, logged:19, due:addD(now,-1), comments:[]},
    {id:"t4", key:"NET-104", p:"p1", title:"Network LLD revision C", status:"todo", pri:"Low", est:12, logged:2, due:addD(now,9), comments:[]},
    {id:"t5", key:"SCD-103", p:"p3", title:"Point-to-point I/O check", status:"done", pri:"Normal", est:10, logged:11, due:addD(now,-5), comments:[]},
  ],
  entries:[], // today's entries for me
  history:[ // previous days for me: [date, hours, status]
    [iso(addD(lastWork,-3)), 8, "approved"], [iso(addD(lastWork,-2)), 9, "approved"], [iso(addD(lastWork,-1)), 8, "pending"], [iso(lastWork), 8, "pending"]
  ],
  team:[
    {id:"e1", state:"live", p:"p1", tk:"NET-105", since:95, in:"07:52", h:0},
    {id:"e3", state:"logged", p:"p3", in:"07:41", h:3},
    {id:"e7", state:"none", in:null, h:0, missed:true},
    {id:"e9", state:"live", p:"p4", tk:"P5G-104", since:180, in:"07:27", h:0},

      <div class="field"><label>Team</label><div class="card" style="margin:0">${p.team.map(id => `<div class="row">${av(id,"s")}<div class="grow"><div class="t" style="font-size:14px">${PEOPLE[id].name}</div><div class="s">${PEOPLE[id].title}</div></div></div>`).join("")}</div></div>`; }
  if (s.v === "person") { const x = S.team.find(y => y.id === s.id), p = PEOPLE[x.id];
    return `<div style="display:flex;gap:12px;align-items:center;margin-bottom:14px">${av(x.id,"l")}<div><h3 style="margin:0">${p.name}</h3><div class="muted">${p.title}</div></div></div>
      <div class="card"><div class="row"><span class="grow muted">Checked in</span><b class="num">${x.in || "—"}</b></div><div class="row"><span class="grow muted">Now</span><b>${x.state === "live" ? `${PROJ[x.p].code} · ${x.tk}` : x.state === "logged" ? `Logged ${x.h} h` : "Not started"}</b></div><div class="row"><span class="grow muted">This week</span><b class="num">27 / 40 h</b></div></div>
      ${x.missed ? `<div class="alert r">${I.warn}<span class="grow">Missed check-out yesterday</span></div>` : ""}
      <button class="btn w ${x.in ? "" : "p"}" data-a="remind" data-id="${x.id}">${x.in ? "Message" : "Send check-in reminder"}</button>`; }
  return "";
}

/* ---------- render ---------- */
const HOME = {eng:"home", sup:"shome", adm:"ahome"};
const V = {ahome:vAdmHome, projects:vProjects, aatt:vAdmAtt, people:vPeople, signin:vSignin, home:vHome, log:vLog, tickets:vTickets, att:vAtt, me:vMe, shome:vSupHome, approvals:vApprovals};
function render(){
  const sc = document.getElementById("screen"), top = sc.querySelector(".scroll")?.scrollTop || 0, same = render.last === S.screen;
  sc.innerHTML = V[S.screen]() + `<div class="scrim ${S.sheet?"on":""}" data-a="close"></div><div class="sheet ${S.sheet?"on":""}"><div class="grab" data-a="close" role="button" aria-label="Close" style="cursor:pointer"></div>${sheetHtml()}</div><div class="toast" id="toast"></div>`;
  if (same) { const s = sc.querySelector(".scroll"); if (s) s.scrollTop = top; }
  render.last = S.screen; bindSlides(); jump();
}
let tt; function toast(m){ const el = document.getElementById("toast"); el.textContent = m; el.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => el.classList.remove("on"), 2400); }
setInterval(() => {
  document.querySelectorAll("[data-live=duty]").forEach(el => el.textContent = clock(dutyMs()));
  document.querySelectorAll("[data-live=timer]").forEach(el => S.timer && (el.textContent = clock(Date.now() - S.timer.start)));
  document.querySelectorAll("[data-live=since]").forEach(el => { el.dataset.m = (+el.dataset.m) + 1/60; el.textContent = clock(el.dataset.m * 60000); });
  const sb = document.querySelector(".statusbar .num"); if (sb) sb.textContent = hm(new Date());
}, 1000);
function jump(){
  const items = S.role === "eng" ? [["signin","Sign in"],["home","Today — check in & timer"],["log","Log hours"],["tickets","Tickets"],["att","Attendance"],["me","Me"]]
    : S.role === "sup" ? [["shome","Team now"],["approvals","Approvals"],["tickets","Tickets"],["att","Attendance"],["me","Me"]]
    : [["ahome","Company overview"],["projects","Projects & budgets"],["aatt","Company attendance"],["people","People & access requests"],["me","Me"]];
  document.getElementById("jump").innerHTML = items.map(([k,l]) => `<button data-a="go" data-v="${k}">${l}</button>`).join("") + `<h3>View as</h3>` + [["eng","Engineer · Ahmed"],["sup","Supervisor · Omar"],["adm","Admin · Huda"]].map(([r,l]) => `<button data-a="switch" data-v="${r}" ${S.role===r?'style="background:#fff;font-weight:600"':""}>${l}</button>`).join("");
}

/* slide-to-confirm */
function bindSlides(){
  document.querySelectorAll("[data-slide]").forEach(sl => {
    const knob = sl.querySelector(".knob"), fill = sl.querySelector(".fill"); let x0 = null, max = 0;
    const move = x => { const dx = Math.max(0, Math.min(max, x - x0)); knob.style.transform = `translateX(${dx}px)`; fill.style.width = (dx + 53) + "px"; return dx; };
    const up = ev => { if (x0 === null) return; const dx = move(ev.clientX); x0 = null; knob.style.transition = fill.style.transition = ".2s";
      if (dx > max * .85) { sl.dataset.slide === "in" ? checkIn() : checkOut(); } else { knob.style.transform = ""; fill.style.width = "0"; } };
    sl.addEventListener("pointerdown", ev => { x0 = ev.clientX; max = sl.offsetWidth - 58; knob.style.transition = fill.style.transition = "none"; sl.setPointerCapture(ev.pointerId); });
    sl.addEventListener("pointermove", ev => { if (x0 !== null) move(ev.clientX); });
    sl.addEventListener("pointerup", up); sl.addEventListener("pointercancel", up);
    sl.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") sl.dataset.slide === "in" ? checkIn() : checkOut(); });
    sl.tabIndex = 0; sl.setAttribute("role", "button"); sl.setAttribute("aria-label", sl.dataset.slide === "in" ? "Check in" : "Check out");
  });
}
function checkIn(){ if (attOpen()) return toast("You're already checked in."); S.att.sessions.push({in:Date.now(), out:null, loc:S.loc}); render(); toast(`Checked in at ${hm(new Date())} · ${S.loc}`); }
function checkOut(){ const s = S.att.sessions[S.att.sessions.length-1]; if (!s || s.out) return; s.out = Date.now(); if (S.timer) stopTimer(); render(); toast(`Checked out · ${r1(dutyMs()/36e5)} h on duty`); }
function startTimer(id){ if (!attOpen()) { S.att.sessions.push({in:Date.now(), out:null, loc:S.loc}); toast("You weren't checked in — checked you in now."); } else toast("Timer started"); S.timer = {tk:id, start:Date.now()}; const t = tk(id); if (t && t.status === "todo") t.status = "doing"; }
function stopTimer(){ const el = Date.now() - S.timer.start, h = Math.max(.25, Math.round(el / 36e5 * 4) / 4), t = tk(S.timer.tk);
  S.entries.push({id:Math.random().toString(36).slice(2), t:t.id, p:t.p, h, note:"", status:"draft"}); t.logged = r1(t.logged + h); S.timer = null; toast(`Saved ${h} h to ${t.key} as a draft`); }

document.addEventListener("click", ev => {
  const b = ev.target.closest("[data-a]"); if (!b) return;
  const a = b.dataset.a, v = b.dataset.v, id = b.dataset.id, s = S.sheet;
  const A = {
    go(){ S.screen = v; S.sheet = null; if (v === "signin") S.role = "eng"; },
    signin(){ S.role = v; S.screen = HOME[v]; },
    signout(){ S.screen = "signin"; S.role = "eng"; },
    switch(){ S.role = v || {eng:"sup", sup:"adm", adm:"eng"}[S.role]; S.screen = HOME[S.role]; S.sheet = null; },
    psel2(){ S.pSel = id; S.whatIf = 0; S.sheet = {v:"project", id}; },
    wi(){ S.whatIf = Number(v); },
    reqok(){ const r = S.requests.find(x => x.id === id); S.requests = S.requests.filter(x => x !== r); toast(`${r.name} can now sign in`); },
    reqno(){ S.requests = S.requests.filter(x => x.id !== id); toast("Request declined"); },
    nudge(){ toast(`Reminder sent to ${PEOPLE[id].name.split(" ")[0]}`); return "stay"; },
    toast(){ toast(b.dataset.t); return "stay"; },
    loc(){ S.loc = v; }, checkin(){ checkIn(); return "stay"; },
    sheet(){ S.sheet = {v, id, sel:null, h:2}; },
    close(){ S.sheet = null; },
    psel(){ s.sel = id; },
    step(){ s.h = Math.max(.5, Math.min(10, (s.h ?? 2) + Number(b.dataset.n))); },
    tstart(){ const sel = s.sel || S.tickets.find(x => x.status !== "done").id; if (sel === "p0") { toast("Timers run on tickets — use + to log overhead."); return "stay"; } startTimer(sel); S.sheet = null; },
    tstartid(){ if (S.timer) stopTimer(); startTimer(id); S.sheet = null; },
    tstop(){ stopTimer(); S.sheet = null; },
    addentry(){ const sel = s.sel || S.tickets.find(x => x.status !== "done").id, h = s.h ?? 2;
      if (todayH() + h > 10) { toast("That's over the 10 h daily limit."); return "stay"; }
      const t = sel === "p0" ? null : tk(sel); S.entries.push({id:Math.random().toString(36).slice(2), t:t && t.id, p:t ? t.p : "p0", h, note:document.getElementById("note").value.trim(), status:"draft"}); if (t) t.logged = r1(t.logged + h);
      S.sheet = null; toast(`Added ${h} h`); },
    del(){ const e = S.entries.find(x => x.id === id); if (e.t) tk(e.t).logged = r1(tk(e.t).logged - e.h); S.entries = S.entries.filter(x => x !== e); },
    submit(){ drafts().forEach(e => e.status = "pending"); toast("Sent to Omar Siddiqui for approval"); },
    day(){ S.day = v; },
    tf(){ S.tf = v; },
    tkst(){ tk(id).status = v; toast("Status updated"); },
    comment(){ const el = document.getElementById("cmt"), tx = el.value.trim(); if (!tx) return "stay"; tk(id).comments.push({by:S.role === "eng" ? "e1" : "u3", text:tx, at:"Just now"}); },
    ntp(){ s.p = v; }, ntpr(){ s.pr = v; },
    newtk(){ const tl = document.getElementById("ntt").value.trim(); if (!tl) { toast("Add a title first."); return "stay"; } const p = s.p || "p1", n = 106 + S.tickets.length;
      S.tickets.unshift({id:"t"+n, key:PROJ[p].code.split("-")[0]+"-"+n, p, title:tl, status:"todo", pri:s.pr||"Normal", est:8, logged:0, due:addD(now,7), comments:[]}); S.sheet = null; S.tf = "all"; toast("Ticket created"); },
    fixsave(){ const v2 = document.getElementById("fixt").value; if (!v2 || toM(v2) <= toM(S.att.missed.in)) { toast(`Check-out must be after ${S.att.missed.in}`); return "stay"; } S.att.missed = null; S.sheet = null; toast(`Saved · Omar has been notified`); },
    cal(){ S.calSel = v; },
    approve(){ S.approvals = S.approvals.filter(x => x.id !== id); toast("Approved"); },
    apprall(){ const n = S.approvals.length; S.approvals = []; toast(`Approved ${n} days`); },
    rsn(){ s.r = v; },
    doreturn(){ const r = document.getElementById("rsn").value.trim(); if (!r) { toast("Add a reason so they know what to fix."); return "stay"; } const ap = S.approvals.find(x => x.id === id); S.approvals = S.approvals.filter(x => x !== ap); S.sheet = null; toast(`Returned to ${PEOPLE[ap.who].name.split(" ")[0]}`); },
    remind(){ S.sheet = null; toast(`Reminder sent to ${PEOPLE[id].name.split(" ")[0]}`); },
  };
  if (A[a] && A[a]() !== "stay") render();
});
render();
})();
</script>
