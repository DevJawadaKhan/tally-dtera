<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1d21">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tally">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Tally — DTERA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#f5f4f0; --panel:#ffffff; --panel-2:#faf9f6; --ink:#1b1d21; --ink-2:#3a3d44; --muted:#6c7078;
  --line:#e5e2db; --line-2:#efece6; --grid:#e1e0d9; --axis:#c3c2b7;
  --accent:#1f6f54; --accent-2:#e6f2ec; --accent-ink:#ffffff;
  --pending:#9a6408; --pending-bg:#fbf1dc; --pending-mark:#d99a1e;
  --bad:#b4321f; --bad-bg:#fbe8e4; --bad-mark:#d03b3b;
  --draft:#525866; --draft-bg:#eceef1;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6;
  --side:#1b1d21; --side-ink:#d9d7d1; --side-muted:#8a8882; --side-hl:#2a2d33;
  --radius:12px; --shadow:0 1px 2px rgba(27,29,33,.05),0 4px 16px rgba(27,29,33,.04);
  --font:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    color-scheme:dark;
    --bg:#15171a; --panel:#1d2024; --panel-2:#22262b; --ink:#eceae5; --ink-2:#c9c7c1; --muted:#959aa3;
    --line:#2e3238; --line-2:#272a30; --grid:#2c2c2a; --axis:#383835;
    --accent:#4fb58c; --accent-2:#1d3229; --accent-ink:#0d1512;
    --pending:#e2ab4a; --pending-bg:#3a2e17; --pending-mark:#e2ab4a;
    --bad:#ef7b67; --bad-bg:#3d221d; --bad-mark:#e66767;
    --draft:#aab0bb; --draft-bg:#2a2e34;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#0ca30c; --s7:#9085e9;
    --side:#101214; --side-hl:#1f2226;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
[dir=rtl] body{font-family:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;line-height:1.2}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 14px;font-weight:500;transition:background .15s,border-color .15s;white-space:nowrap}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--line-2)}
.btn.sm{padding:5px 10px;font-size:13.5px}
.btn.xs{padding:2px 7px;font-size:12.5px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.input:focus-visible,.chip:focus-visible,.acct:focus-visible,.pchip:focus-visible,.side a:focus-visible,.rp-cell:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.input{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 11px;min-height:40px}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-2)}
.input.sm{min-height:32px;padding:4px 8px;font-size:13.5px}
textarea.input{min-height:70px;resize:vertical}
label.f{display:block;font-size:13px;font-weight:500;color:var(--ink-2);margin-bottom:5px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.card-h h2{font-size:16px;font-weight:600}
.card-h .sub{font-size:13px;color:var(--muted)}
.card-b{padding:18px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;padding:2px 9px;border-radius:99px;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-draft{color:var(--draft);background:var(--draft-bg)}
.b-pending{color:var(--pending);background:var(--pending-bg)}
.b-approved{color:var(--accent);background:var(--accent-2)}
.b-rejected{color:var(--bad);background:var(--bad-bg)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;padding:1px 8px;border-radius:6px;background:var(--line-2);color:var(--ink-2);white-space:nowrap}
.tag.warn{background:var(--pending-bg);color:var(--pending)}
.tag.bad{background:var(--bad-bg);color:var(--bad)}
.tag.good{background:var(--accent-2);color:var(--accent)}

/* sign in */
.auth{min-height:100vh;display:flex;flex-direction:column;background:
  radial-gradient(circle at 1px 1px, color-mix(in srgb,var(--ink) 9%,transparent) 1px, transparent 0) 0 0/22px 22px, var(--bg)}
.auth-top{display:flex;align-items:center;justify-content:space-between;padding:20px 32px}
.auth-top .brand{color:var(--ink)}
.auth-top .for{font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-2);border-radius:99px;padding:3px 10px;margin-inline-start:4px}
.auth-main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,440px);gap:56px;align-items:center;max-width:1120px;width:100%;margin:0 auto;padding:12px 32px 40px}
.pitch .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink-2);background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:5px 12px 5px 6px}
[dir=rtl] .pitch .eyebrow{padding:5px 6px 5px 12px}
.pitch .eyebrow i{width:20px;height:20px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:#fff;font-style:normal;font-size:11px}
.pitch h1{font-size:clamp(30px,3.6vw,44px);font-weight:700;letter-spacing:-.025em;line-height:1.12;margin:18px 0 14px;max-width:18ch}
[dir=rtl] .pitch h1{letter-spacing:0;line-height:1.35}
.pitch h1 em{font-style:normal;color:var(--accent)}
.pitch p{color:var(--muted);font-size:16.5px;max-width:48ch;margin:0 0 26px}
.feat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:560px}
.feat div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.feat svg{flex:none;color:var(--accent);margin-top:2px}
.feat b{display:block;font-size:14px;font-weight:600}
.feat small{display:block;color:var(--muted);font-size:13px;line-height:1.4;margin-top:2px}
.live-strip{display:flex;gap:10px;align-items:center;margin-top:22px;font-size:13px;color:var(--muted)}
.live-strip .avs{display:flex}
.live-strip .avs .av{border:2px solid var(--bg);margin-inline-start:-8px}
.live-strip .avs .av:first-child{margin-inline-start:0}
.auth-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 40px rgba(27,29,33,.08);padding:26px}
.auth-card h2{font-size:21px;font-weight:600;margin-bottom:4px}
.auth-tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--line-2);border-radius:11px;padding:4px;margin-bottom:22px}
.auth-tabs button{border:0;background:transparent;border-radius:8px;padding:8px;font-weight:600;color:var(--muted);font-size:14px}
.auth-tabs button[aria-selected=true]{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.auth-card .stack-f{display:grid;gap:12px}
.ms{width:100%;padding:11px;gap:10px}
.ms-note{font-size:12.5px;color:var(--muted);margin:6px 0 0;display:flex;gap:6px;align-items:flex-start}
.divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12.5px;margin:18px 0}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.demo{margin-top:20px;border-top:1px dashed var(--line);padding-top:16px}
.demo h3{font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.demo .seg{margin-bottom:10px}
.accts{display:flex;flex-wrap:wrap;gap:6px}
.acct{display:inline-flex;align-items:center;gap:8px;text-align:start;border:1px solid var(--line);background:var(--panel-2);border-radius:99px;padding:4px 12px 4px 4px;transition:border-color .15s}
[dir=rtl] .acct{padding:4px 4px 4px 12px}
.acct:hover{border-color:var(--accent)}
.acct b{font-weight:500;font-size:13px}
.acct small{display:none}
.acct .av{width:24px;height:24px;font-size:10px}
.ok-box{text-align:center;padding:16px 4px}
.ok-box .ic{width:52px;height:52px;border-radius:50%;background:var(--accent-2);color:var(--accent);display:grid;place-items:center;margin:0 auto 12px}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;flex:none;color:#fff}
.av.s{width:24px;height:24px;font-size:10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:18px;letter-spacing:-.01em;color:#fff}
.logo{width:28px;height:28px;border-radius:8px;background:#2f8c69;display:grid;place-items:center;flex:none}

/* app layout with sidebar */
.layout{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.layout > div{min-width:0}
.side{background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 12px;overflow-y:auto}
.side .brand{padding:2px 8px 4px}
.side .co-s{font-size:12px;color:var(--side-muted);padding:0 8px 0 46px;margin-bottom:18px}
[dir=rtl] .side .co-s{padding:0 46px 0 8px}
.side .grp{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--side-muted);padding:14px 10px 6px}
[dir=rtl] .side .grp{letter-spacing:0;text-transform:none;font-size:12px}
.side a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--side-ink);text-decoration:none;font-size:14px;font-weight:500;cursor:pointer}
.side a svg{opacity:.75;flex:none}
.side a:hover{background:var(--side-hl)}
.side a[aria-current=page]{background:#2f8c69;color:#fff}
.side a[aria-current=page] svg{opacity:1}
.side a .cnt{margin-inline-start:auto;font-family:var(--mono);font-size:11px;background:#3a3021;color:#e8b55c;padding:0 7px;border-radius:99px}
.side a[aria-current=page] .cnt{background:rgba(255,255,255,.2);color:#fff}
.side .me-box{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 8px 4px;border-top:1px solid var(--side-hl)}
.side .me-box .who{font-size:13px;line-height:1.25;flex:1;min-width:0}
.side .me-box .who small{display:block;color:var(--side-muted)}
.side .me-box button{background:transparent;border:1px solid var(--side-hl);color:var(--side-ink);border-radius:8px;padding:4px 8px;font-size:12.5px}
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar .in{display:flex;align-items:center;gap:10px;height:56px;padding:0 28px}
.crumb{font-size:14px;color:var(--muted)}
.crumb b{color:var(--ink);font-weight:600}
.spacer{flex:1}
.bell{position:relative}
.bell .dotc{position:absolute;top:1px;inset-inline-end:1px;min-width:16px;height:16px;border-radius:99px;background:var(--bad-mark);color:#fff;font-size:10px;font-family:var(--mono);display:grid;place-items:center;padding:0 4px}
.npanel{position:absolute;top:50px;inset-inline-end:20px;width:360px;max-width:calc(100vw - 24px);background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.14);z-index:30;overflow:hidden}
.npanel h3{font-size:14px;padding:12px 16px;border-bottom:1px solid var(--line-2)}
.npanel ul{list-style:none;margin:0;padding:0;max-height:380px;overflow:auto}
.npanel li{padding:11px 16px;border-top:1px solid var(--line-2);font-size:13.5px}
.npanel li:first-child{border-top:0}
.npanel li.unread{background:var(--accent-2)}
.npanel li small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.timer-pill{display:inline-flex;align-items:center;gap:8px;background:var(--accent-2);color:var(--accent);border-radius:99px;padding:4px 5px 4px 12px;font-size:13px;font-weight:500;border:1px solid color-mix(in srgb,var(--accent) 30%,transparent)}
[dir=rtl] .timer-pill{padding:4px 12px 4px 5px}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1.4s infinite;display:inline-block;flex:none}
@keyframes pulse{50%{opacity:.25}}
main{padding:26px 28px 64px;max-width:1240px}
.mnav{display:none}
.mnav .cnt{font-size:10px;font-family:var(--mono);color:#e8b55c;position:absolute;margin-inline-start:22px;margin-top:-2px}
.mnav button{position:relative}
.m-brand{display:none;align-items:center;gap:8px;font-weight:600;font-size:16px}
.m-brand .logo{width:24px;height:24px}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.page-h h1{font-size:26px;font-weight:600;letter-spacing:-.015em}
.page-h p{margin:4px 0 0;color:var(--muted)}
.page-h .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:20px}
.g-main{grid-template-columns:minmax(0,1fr) 320px;align-items:start}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
.g-32{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);align-items:start}
.mb{margin-bottom:20px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.stat span{font-size:13px;color:var(--muted)}
.stat b{display:block;font-size:25px;font-weight:600;margin-top:2px;font-family:var(--mono);letter-spacing:-.02em}
.stat b small{font-size:13px;color:var(--muted);font-weight:500;margin-inline-start:3px}
.stat .d{font-size:12.5px;color:var(--muted);margin-top:2px}
.stat .d.good{color:var(--accent)} .stat .d.warn{color:var(--pending)} .stat .d.bad{color:var(--bad)}
.alert{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:10px;font-size:14px;margin-bottom:18px;flex-wrap:wrap}
.alert.warn{background:var(--pending-bg);color:var(--pending)}
.alert.bad{background:var(--bad-bg);color:var(--bad)}
.alert.info{background:var(--accent-2);color:var(--accent)}
.alert .grow{flex:1;min-width:200px}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;background:var(--pending-bg);color:var(--pending);font-size:14px;margin-bottom:20px}

/* day log */
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:18px}
.chip{flex:none;min-width:86px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 12px;text-align:start}
.chip small{display:block;color:var(--muted);font-size:12px}
.chip b{display:block;font-weight:600;font-size:14px}
.chip .h{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:5px;margin-top:2px}
.chip[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);background:var(--accent-2)}
.chip.off{opacity:.6}
.chip.miss{border-style:dashed;border-color:var(--pending-mark)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--line);flex:none}
.dot.approved{background:var(--accent)}.dot.pending{background:var(--pending-mark)}.dot.rejected{background:var(--bad-mark)}.dot.draft{background:var(--draft)}
.timer-card{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.timer-card .clock{font-family:var(--mono);font-size:28px;font-weight:500;letter-spacing:-.02em;min-width:130px}
.timer-card.running{background:var(--accent-2)}
.timer-card .grow{flex:1;min-width:200px}
.timer-fields{display:flex;gap:8px;flex:1;min-width:260px;flex-wrap:wrap}
.timer-fields > *{flex:1;min-width:150px}
.quick{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.quick .lbl{font-size:13px;color:var(--muted)}
.pchip{border:1px solid var(--line);background:var(--panel-2);border-radius:99px;padding:4px 11px;font-size:13px}
.pchip:hover{border-color:var(--accent)}
.entry-form{display:grid;grid-template-columns:minmax(0,1.8fr) 140px minmax(0,1.4fr) auto;gap:10px;align-items:end}
.stepper{display:flex;border:1px solid var(--line);border-radius:9px;background:var(--panel);overflow:hidden;min-height:40px}
.stepper button{border:0;background:transparent;width:36px;font-size:18px;color:var(--muted)}
.stepper button:hover{background:var(--panel-2);color:var(--ink)}
.stepper input{border:0;width:100%;text-align:center;background:transparent;outline:none;font-family:var(--mono)}
.form-err{color:var(--bad);font-size:13px;margin-top:8px}
.meter{height:8px;background:var(--line-2);border-radius:99px;overflow:hidden;display:flex;gap:2px}
.meter i{display:block;height:100%}
.meter-row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:6px}
.rows{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:12px 18px;border-top:1px solid var(--line-2)}
.row:first-child{border-top:0}
.row .p{font-weight:500}
.code{font-family:var(--mono);font-size:12px;color:var(--muted);margin-inline-end:6px}
.tk{font-family:var(--mono);font-size:12px;color:var(--s1);margin-inline-end:6px}
.row .n{font-size:13.5px;color:var(--muted);margin-top:2px}
.row .why{font-size:13px;color:var(--bad);margin-top:4px}
.row .hrs{font-family:var(--mono);font-weight:500;font-size:15px}
.row .acts{display:flex;gap:4px}
.empty{padding:34px 18px;text-align:center;color:var(--muted)}
.empty svg{display:block;margin:0 auto 10px;opacity:.6}
.card-f{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-top:1px solid var(--line-2);background:var(--panel-2);border-radius:0 0 var(--radius) var(--radius);flex-wrap:wrap}
aside .card+.card{margin-top:20px}
.kv{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--line-2);font-size:14px;gap:10px}
.kv:first-child{border-top:0}
.feed{list-style:none;padding:0;margin:0}
.feed li{padding:10px 0;border-top:1px solid var(--line-2);font-size:13.5px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.feed li:first-child{border-top:0}

/* approvals */
.grp{border-top:1px solid var(--line-2)}
.grp:first-child{border-top:0}
.grp-h{display:flex;align-items:center;gap:12px;padding:14px 18px;flex-wrap:wrap}
.grp-h .meta{flex:1;min-width:180px}
.grp-h .meta b{font-weight:600}
.grp-h .meta small{display:flex;flex-wrap:wrap;gap:6px;align-items:center;color:var(--muted);font-size:13px;margin-top:2px}
.grp .rows .row{padding-inline-start:62px;background:var(--panel-2)}
.reject-box{display:flex;gap:8px;padding:12px 18px 16px 62px;background:var(--panel-2);flex-wrap:wrap}
[dir=rtl] .reject-box{padding:12px 62px 16px 18px}
.reject-box .input{flex:1;min-width:200px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
.t th,.t td{padding:10px 14px;text-align:start;border-top:1px solid var(--line-2);white-space:nowrap}
.t thead th{border-top:0;font-size:12.5px;font-weight:500;color:var(--muted);background:var(--panel-2)}
.t td.r,.t th.r{text-align:end}
.t tfoot td{font-weight:600;background:var(--panel-2)}
.t tr.click{cursor:pointer}
.t tr.click:hover td{background:var(--panel-2)}
.scroll-x{overflow-x:auto}
.cell{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:13px}
.cell.zero{color:var(--axis)}
.month-nav{display:flex;align-items:center;gap:6px}
.month-nav b{min-width:150px;text-align:center;font-weight:600}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;align-items:end}
.form-grid .wide{grid-column:span 2}

/* charts */
.bars{display:grid;gap:12px}
.bar-row{display:grid;grid-template-columns:minmax(120px,200px) minmax(0,1fr) 92px;gap:12px;align-items:center;font-size:14px}
.bar-row .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .track{height:10px;background:var(--line-2);border-radius:99px;overflow:visible;position:relative}
.bar-row .track i{display:block;height:100%;border-radius:4px}
.bar-row .track .mark{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink-2);border-radius:2px}
.bar-row .v{text-align:end;font-family:var(--mono);font-size:13.5px}
.bar-row .v small{display:block;color:var(--muted);font-size:11.5px}
.swatch{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .ln{width:16px;height:0;border-top:2px solid var(--accent)}
.legend .ln.dash{border-top:2px dashed var(--ink-2);opacity:.6}
.chart{direction:ltr;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--mono);font-size:11px;fill:var(--muted)}
.chart .hit{fill:transparent}
.chart .hl{opacity:0;fill:var(--line-2)}
.chart g.col:hover .hl{opacity:1}
.stack{display:flex;height:14px;border-radius:5px;overflow:hidden;gap:2px;margin:8px 0 12px}
.stack i{display:block;height:100%}
.prog{height:8px;background:var(--line-2);border-radius:99px;overflow:hidden;min-width:60px;position:relative}
.prog i{display:block;height:100%;border-radius:99px;background:var(--accent)}
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;padding:7px 10px;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.18);max-width:260px;line-height:1.45;display:none}
#tip b{font-family:var(--mono)}

/* who's where */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.pcard.live{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));box-shadow:inset 3px 0 0 var(--accent)}
[dir=rtl] .pcard.live{box-shadow:inset -3px 0 0 var(--accent)}
.pcard .top{display:flex;gap:10px;align-items:center}
.pcard .top b{display:block;font-size:14px;font-weight:600}
.pcard .top small{display:block;color:var(--muted);font-size:12.5px}
.pcard .now{font-size:13.5px;display:flex;gap:8px;align-items:flex-start}
.pcard .now .what{flex:1;min-width:0}
.pcard .now .what div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .plan{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line-2);padding-top:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.seg{display:flex;gap:4px;background:var(--line-2);border-radius:9px;padding:3px}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:7px;font-size:13.5px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* tickets */
.board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:14px;overflow-x:auto;align-items:start}
.col-h{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;color:var(--ink-2);padding:0 4px 8px}
.col-h .num{color:var(--muted);font-weight:500}
.lane{background:var(--line-2);border-radius:12px;padding:8px;display:grid;gap:8px;min-height:120px}
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 12px;display:grid;gap:8px;font-size:13.5px}
.tcard .ttl{font-weight:500;line-height:1.35}
.tcard .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tcard .foot{display:flex;align-items:center;gap:6px;justify-content:space-between}
.tcard .foot .l{display:flex;align-items:center;gap:6px;min-width:0}
.pri-urgent{background:var(--bad-bg);color:var(--bad)}
.pri-high{background:var(--pending-bg);color:var(--pending)}
.pri-normal{background:var(--line-2);color:var(--ink-2)}
.pri-low{background:transparent;color:var(--muted);border:1px solid var(--line)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.filters .input{width:auto;min-width:160px}

/* resource planning */
.rp td,.rp th{padding:6px 8px}
.rp-cell{width:100%;min-width:86px;border:1px solid transparent;border-radius:8px;padding:6px 8px;text-align:center;font-family:var(--mono);font-size:13px;background:var(--line-2)}
.rp-cell small{display:block;font-size:10.5px;color:var(--muted)}
.rp-cell.ok{background:var(--accent-2);color:var(--accent)}
.rp-cell.under{background:var(--pending-bg);color:var(--pending)}
.rp-cell.over{background:var(--bad-bg);color:var(--bad)}
.rp-cell.zero{background:var(--panel-2);color:var(--muted);border:1px dashed var(--line)}
.rp-cell.sel{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.alloc-row{display:grid;grid-template-columns:minmax(0,1fr) 110px auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line-2)}
.alloc-row:first-child{border-top:0}

/* project detail */
.ph{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;margin-bottom:20px}
.ph .info{flex:1;min-width:260px}
.ph h1{font-size:26px;font-weight:600}
.ph .meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:14px;margin-top:6px}
.timeline{margin-top:12px;max-width:520px}
.timeline .prog{height:10px}
.timeline .lbls{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:4px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.18);transition:opacity .2s,transform .2s}
.toast[hidden]{display:block;opacity:0;pointer-events:none;transform:translateX(-50%) translateY(8px)}

/* attendance */
.ci-btn{display:inline-flex;align-items:center;gap:8px;border-radius:99px;padding:6px 14px;font-weight:600;font-size:13.5px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink)}
.ci-btn.out{background:var(--panel);color:var(--ink);border-color:var(--line)}
.ci-btn.done{background:var(--line-2);color:var(--muted);border-color:transparent;cursor:default}
.att-card{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.att-card .big{font-family:var(--mono);font-size:26px;font-weight:500}
.att-card .grow{flex:1;min-width:180px}
.att-card select{width:auto;min-height:36px}
.reg td{padding:4px 2px;text-align:center}
.reg th{padding:6px 2px;text-align:center;font-size:11px}
.reg td:first-child,.reg th:first-child{text-align:start;padding-inline:12px;position:sticky;inset-inline-start:0;background:var(--panel);z-index:1}
.ac{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px;font-size:11px;font-weight:600;font-family:var(--mono)}
.ac.P{background:var(--accent-2);color:var(--accent)}
.ac.L{background:var(--pending-bg);color:var(--pending)}
.ac.A{background:var(--bad-bg);color:var(--bad)}
.ac.V{background:color-mix(in srgb,var(--s7) 16%,transparent);color:var(--s7)}
.ac.W{color:var(--axis)}
.ac.F{color:var(--axis);border:1px dashed var(--line)}
.ac.N{background:var(--line-2);color:var(--muted)}
button.ac{border:0;cursor:pointer;font:inherit;font-family:var(--mono);font-size:11px;font-weight:600}
button.ac:disabled{cursor:default;background:transparent}
.ac.miss{box-shadow:inset 0 -3px 0 var(--bad-mark)}
.ac.corr{outline:1px dashed var(--ink-2);outline-offset:1px}
.lnk{color:inherit;text-decoration:none;cursor:pointer;border-bottom:1px dotted var(--axis)}
.lnk:hover{color:var(--accent);border-bottom-color:var(--accent)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .hd{font-size:11px;color:var(--muted);text-align:center;padding-bottom:2px}
.cal .d{border:1px solid var(--line);border-radius:9px;padding:6px 7px;min-height:56px;text-align:start;background:var(--panel);display:flex;flex-direction:column;gap:3px;font:inherit}
.cal .d .n{font-size:12px;color:var(--muted);font-family:var(--mono)}
.cal .d .ac{width:auto;height:auto;padding:1px 6px;align-self:flex-start}
.cal .d small{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.cal .d.sel{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.cal .d.out{opacity:.35}
.cal .d.we{background:var(--panel-2)}
.tl{position:relative;height:16px;background:var(--line-2);border-radius:6px;margin:6px 0 2px}
.tl i{position:absolute;top:0;bottom:0;background:var(--accent);border-radius:5px}
.tl i.open{background:repeating-linear-gradient(45deg,var(--accent),var(--accent) 4px,var(--accent-2) 4px,var(--accent-2) 8px)}
.tl .st{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--pending-mark)}
.tl-l{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);font-family:var(--mono);direction:ltr}
.sess{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center;padding:6px 0}
.hero-av{width:56px;height:56px;font-size:19px}
.desc{white-space:pre-wrap;font-size:14.5px;line-height:1.6}
.cmt{display:flex;gap:10px;padding:12px 0;border-top:1px solid var(--line-2)}
.cmt:first-child{border-top:0}
.cmt .b{flex:1;min-width:0;font-size:14px}
.cmt .b small{color:var(--muted);font-size:12px;margin-inline-start:6px}
.fld{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line-2);font-size:14px}
.fld:first-child{border-top:0}
.fld > span:first-child{color:var(--muted);font-size:13px}
@media (max-width:1100px){ .g-main,.g-32{grid-template-columns:minmax(0,1fr)} }
@media (max-width:900px){
  .auth-top{padding:16px 18px}
  .auth-main{grid-template-columns:minmax(0,1fr);gap:26px;padding:4px 16px 32px}
  .auth-card{order:-1;padding:20px}
  .feat{grid-template-columns:minmax(0,1fr)}
  .pitch h1{font-size:28px}
  .layout{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .mnav{display:flex;gap:2px;overflow-x:auto;position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--side);padding:6px 6px calc(6px + env(safe-area-inset-bottom));border-top:1px solid var(--side-hl);scrollbar-width:none}
  .mnav button{flex:1 0 64px;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:transparent;color:var(--side-muted);border-radius:10px;padding:6px 4px;font-size:10.5px;white-space:nowrap}
  .mnav button svg{width:20px;height:20px}
  .mnav button[aria-current=page]{color:#fff;background:var(--side-hl)}
  .mnav button[aria-current=page] svg{color:#8fd3b6}
  .topbar .in{padding:0 14px;padding-top:env(safe-area-inset-top);gap:6px}
  .topbar .crumb .cs{display:none}
  .topbar .lang-txt{display:none}
  .topbar .ci-btn,.timer-pill .code{display:none}
  .timer-pill{padding:3px 4px 3px 10px}
  .topbar .crumb{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .m-brand{display:flex!important}
  main{padding:18px 14px 96px}
  .page-h h1{font-size:22px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat b{font-size:21px}
  .att-card .big{font-size:22px}
  .att-card .ci-btn{width:100%;justify-content:center;padding:12px;font-size:15px}
  .g-2{grid-template-columns:minmax(0,1fr)}
  .entry-form{grid-template-columns:1fr 1fr}
  .entry-form .f-proj,.entry-form .f-note{grid-column:1/-1}
  .bar-row{grid-template-columns:110px 1fr 76px}
  .board{grid-template-columns:repeat(4,240px)}
  .form-grid .wide{grid-column:auto}
}
</style>

const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (d, n) => { const x = new Date(typeof d === "string" ? parse(d) : d); x.setDate(x.getDate()+n); return x; };
const addMonths = (d, n) => { const x = new Date(d); x.setMonth(x.getMonth()+n); return x; };
const TODAY = iso(new Date());
const THIS_MONTH = TODAY.slice(0,7);
const isWeekend = s => { const g = parse(s).getDay(); return g === 5 || g === 6; }; // Fri–Sat
const diffDays = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
const weekOf = s => iso(addDays(s, -parse(s).getDay()));
const THIS_WEEK = weekOf(TODAY);
const r1 = n => Math.round(n*10)/10;
const sum = (a, f) => a.reduce((t, x) => t + f(x), 0);
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const money = n => new Intl.NumberFormat("en-US", {maximumFractionDigits:0}).format(Math.round(n));
const kMoney = n => Math.abs(n) >= 1e6 ? r1(n/1e6) + "M" : Math.abs(n) >= 1e3 ? Math.round(n/1e3) + "k" : money(n);

const monthEnd = m => { const d = parse(m+"-01"); d.setMonth(d.getMonth()+1); d.setDate(0); return iso(d); };
const monthExpectedDays = m => { const end = m === THIS_MONTH ? iso(addDays(new Date(), -1)) : monthEnd(m); return end < m+"-01" ? [] : workdaysIn(m+"-01", end); };

/* project finance & forecasting */
function finance(p){
  const appr = S.entries.filter(e => e.projectId === p.id && e.status === "approved");
  const live = S.entries.filter(e => e.projectId === p.id && e.status !== "rejected");
  const avgRate = (() => { const ids = new Set([...(p.members || []).map(m => m.userId), ...S.allocs.filter(a => a.projectId === p.id).map(a => a.userId)]); const r = [...ids].map(i => user(i).rate).filter(Boolean); return r.length ? sum(r, x => x) / r.length : 130; })();
  const hours = (p.opening || 0) + sum(appr, e => e.hours);
  const actual = (p.opening || 0) * avgRate + sum(appr, cost);
  const committed = sum(live.filter(e => e.status !== "approved"), cost);           // pending + draft, not yet in actuals
  let elapsed = 0;
  if (p.start && p.end) elapsed = Math.max(0, Math.min(1, diffDays(p.start, TODAY) / Math.max(1, diffDays(p.start, p.end))));
  const spent = p.budgetCost ? actual / p.budgetCost : 0;
  // weekly burn over the last 8 complete weeks (approved + pending)
  const w8 = iso(addDays(THIS_WEEK, -56));
  const weekly = sum(live.filter(e => e.date >= w8 && e.date < THIS_WEEK), cost) / 8;
  const weeksLeft = p.end && p.end > TODAY ? diffDays(TODAY, p.end) / 7 : 0;
  const adj = 1 + ((UI.whatIf || {})[p.id] || 0) / 100;
  // method 1: run rate
  const eacRun = actual + committed + weekly * adj * weeksLeft;
  // method 2: resource plan (planned hours × rate), run rate beyond the plan horizon
  const futAl = S.allocs.filter(a => a.projectId === p.id && a.week >= THIS_WEEK && (!p.end || a.week <= p.end));
  const planWeeks = new Set(futAl.map(a => a.week)).size;
  const planCost = sum(futAl, a => a.hours * (user(a.userId).rate || avgRate)) * adj;
  const eacPlan = actual + committed + planCost + weekly * adj * Math.max(0, weeksLeft - planWeeks);
  // method 3: straight line on elapsed time
  const eacLine = elapsed > .05 ? actual / elapsed : p.budgetCost;
  const eac = eacRun;
  const status = !p.budgetCost ? "" : spent > 1 ? "over" : eac > p.budgetCost * 1.05 ? "atrisk" : "ontrack";
  // when does the budget run out at the current burn?
  const left = p.budgetCost - actual - committed;
  const runOut = !p.budgetCost ? "" : left <= 0 ? TODAY : weekly * adj > 0 ? iso(addDays(TODAY, Math.round(left / (weekly * adj) * 7))) : "";
  return {hours, actual, committed, elapsed, eac, eacRun, eacPlan, eacLine, spent, status, variance: p.budgetCost - eac, avgRate, weekly: weekly * adj, weeksLeft, runOut, adj};
}

/* ================= charts ================= */
function columns(items, opts = {}){
  const W = 720, Hh = opts.h || 200, padL = 40, padB = 22, padT = 12;
  const n = items.length || 1, slot = (W - padL) / n, bw = Math.max(4, Math.min(28, slot * .62));
  const maxV = Math.max(opts.ref || 0, ...items.map(it => sum(it.segs, s => s.v)), 1);
  const step = maxV > 400 ? 100 : maxV > 40 ? 20 : maxV > 12 ? 4 : 2;
  const nice = Math.ceil(maxV / step) * step;
  const y = v => padT + (Hh - padT - padB) * (1 - v / nice);
  let g = [0, nice/2, nice].map(v => `<line x1="${padL}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${padL-6}" y="${y(v)+3.5}" text-anchor="end">${v}</text>`).join("");
  g += `<line x1="${padL}" x2="${W}" y1="${y(0)}" y2="${y(0)}" stroke="var(--axis)"/>`;
  const every = Math.ceil(n / 12);
  items.forEach((it, i) => {
    const cx = padL + slot * i + slot / 2;
    let acc = 0, segs = "";
    const nz = it.segs.filter(s => s.v > 0);
    nz.forEach((s, si) => {
      const y0 = y(acc), y1 = y(acc + s.v); acc += s.v;
      const hgt = Math.max(0, y0 - y1 - (si > 0 ? 2 : 0)), yy = y1, r = Math.min(3, hgt);
      segs += si === nz.length - 1
        ? `<path d="M${cx-bw/2},${yy+hgt} V${yy+r} Q${cx-bw/2},${yy} ${cx-bw/2+r},${yy} H${cx+bw/2-r} Q${cx+bw/2},${yy} ${cx+bw/2},${yy+r} V${yy+hgt} Z" fill="${s.c}"/>`
        : `<rect x="${cx-bw/2}" y="${yy}" width="${bw}" height="${hgt}" fill="${s.c}"/>`;
    });
    g += `<g class="col"><rect class="hl" x="${cx-slot/2}" y="${padT}" width="${slot}" height="${Hh-padT-padB}" rx="4"/>${segs}<rect class="hit" x="${cx-slot/2}" y="0" width="${slot}" height="${Hh}" data-tip="${esc(it.tip)}"/></g>`;
    if (i % every === 0 || i === n-1) g += `<text x="${cx}" y="${Hh-6}" text-anchor="middle">${esc(it.label)}</text>`;
  });
  if (opts.ref) g += `<line x1="${padL}" x2="${W}" y1="${y(opts.ref)}" y2="${y(opts.ref)}" stroke="var(--ink-2)" stroke-width="1.5" stroke-dasharray="4 4" opacity=".55"/><text x="${W}" y="${y(opts.ref)-5}" text-anchor="end" style="fill:var(--ink-2)">${esc(opts.refLabel||"")}</text>`;
  return `<div class="chart"><svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="${esc(opts.aria||"")}">${g}</svg></div>`;
}
function lines(points, opts = {}){ // points [{label, a, p, tip}] a=actual p=plan
  const W = 720, Hh = 220, padL = 46, padB = 22, padT = 12;
  const n = points.length, maxV = Math.max(opts.max || 0, ...points.map(p => Math.max(p.a ?? 0, p.p ?? 0, p.f ?? 0)), 1);
  const x = i => padL + (W - padL - 10) * (n <= 1 ? 0 : i / (n - 1));
  const y = v => padT + (Hh - padT - padB) * (1 - v / maxV);
  let g = [0, .5, 1].map(f => `<line x1="${padL}" x2="${W}" y1="${y(maxV*f)}" y2="${y(maxV*f)}" stroke="var(--grid)"/><text x="${padL-6}" y="${y(maxV*f)+3.5}" text-anchor="end">${kMoney(maxV*f)}</text>`).join("");
  if (opts.budget) g += `<line x1="${padL}" x2="${W}" y1="${y(opts.budget)}" y2="${y(opts.budget)}" stroke="var(--bad-mark)" stroke-width="1" stroke-dasharray="2 3"/><text x="${W}" y="${y(opts.budget)-5}" text-anchor="end" style="fill:var(--bad)">${esc(opts.budgetLabel||"")}</text>`;
  const path = k => points.map((p, i) => p[k] == null ? null : `${x(i)},${y(p[k])}`).filter(Boolean);
  const pp = path("p"), ap = path("a"), fp = path("f");
  if (pp.length) g += `<polyline points="${pp.join(" ")}" fill="none" stroke="var(--ink-2)" stroke-width="2" stroke-dasharray="5 5" opacity=".55"/>`;
  if (fp.length > 1) g += `<polyline points="${fp.join(" ")}" fill="none" stroke="var(--s1)" stroke-width="2" stroke-dasharray="2 4" stroke-linecap="round"/>`;
  if (ap.length) g += `<polyline points="${ap.join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>`;
  const last = points.map((p,i)=>[p,i]).filter(([p]) => p.a != null).pop();
  if (last) g += `<circle cx="${x(last[1])}" cy="${y(last[0].a)}" r="4.5" fill="var(--accent)" stroke="var(--panel)" stroke-width="2"/>`;
  const every = Math.ceil(n / 8);
  points.forEach((p, i) => {
    const w = (W - padL) / Math.max(1, n - 1);
    g += `<rect class="hit" x="${x(i) - w/2}" y="0" width="${w}" height="${Hh}" data-tip="${esc(p.tip)}"/>`;
    if (i % every === 0 || i === n - 1) g += `<text x="${x(i)}" y="${Hh-6}" text-anchor="middle">${esc(p.label)}</text>`;
  });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="${esc(opts.aria||"")}">${g}</svg></div>`;
}
function hbars(rows){

const statusSegs = list => [

function dailyChart(list, m){

function weeklyItems(list){

        <button class="btn primary" type="submit">${I.play}${t("startTimer")}</button></form>`;
  return shell(`
    ${pageH(t("hello",{name:esc(u.name.split(" ")[0])}), t("engSub",{sup:esc(sup.name)}), `<span class="muted" style="font-size:13px">${t("backNote",{n:bd})}</span>`)}

    ${returnedAll.length ? `<div class="alert bad">${I.info}<span class="grow">${t("fixReturned",{n:returnedAll.length})}</span><button class="btn sm" data-a="day" data-d="${returnedAll[0].date}">${t("review")}</button></div>` : ""}

            <div class="f-note"><label class="f" for="fn">${t("note")}</label><input id="fn" name="n" class="input" maxlength="140" placeholder="${t("notePh")}" value="${esc(ed?.note || "")}"></div>
            <div style="display:flex;gap:6px">${ed ? `<button type="button" class="btn" data-a="cancelEdit">${t("cancel")}</button>` : ""}<button class="btn primary" type="submit">${ed ? t("saveEntry") : t("add")}</button></div>
          </form>
          ${UI.err ? `<div class="form-err" role="alert">${UI.err}</div>` : ""}
        </div>` : `<div class="card-b"><div class="note" style="margin:0">${I.lock}${isClosed(UI.day) ? t("closedLock",{m:fmtMonth(UI.day.slice(0,7))}) : t("locked",{n:bd})}</div></div>`}
        <ul class="rows" style="border-top:1px solid var(--line-2)">${rows || `<li class="empty">${I.clock}${t("noEntries")}</li>`}</ul>
        <div class="card-f">
          <div style="flex:1;min-width:200px;max-width:360px">
            <div class="meter-row"><span>${t("dayTotal")}</span><span><b class="num" style="color:var(--ink)">${r1(total)}</b> / <span class="num">${max}</span> ${t("h")}</span></div>
            <div class="meter">${segW("approved")}${segW("pending")}${segW("draft")}</div>
          </div>
          <button class="btn primary" data-a="submit" ${drafts.length && editable ? "" : "disabled"}>${t("submitDay")}${drafts.length ? ` · <span class="num">${drafts.length}</span>` : ""}</button>
        </div>
      </div>
      <aside>
        <div class="card"><div class="card-h"><div><h2>${t("weekHours")}</h2><div class="sub">${t("weekHoursSub")}</div></div></div>
          <div class="card-b">${columns([...Array(7)].map((_, i) => { const d = iso(addDays(THIS_WEEK, i)), l = dayEntries(u.id, d).filter(e => e.status !== "rejected"), segs = statusSegs(l); return {label:fmtDay(d,{weekday:"narrow"}), segs, tip:`${fmtDay(d)}<br><b>${r1(sum(segs, s => s.v))} ${t("h")}</b>`}; }), {h:150, ref:S.settings.stdDay, refLabel:`${S.settings.stdDay}`, aria:t("weekHours")})}
          <div style="margin-top:8px">${statusLegend()}</div></div></div>
        <div class="card"><div class="card-h"><h2>${t("thisMonth")}</h2><span class="sub">${fmtMonth(THIS_MONTH)}</span></div>
          <div class="card-b" style="padding-top:8px;padding-bottom:8px">
            <div class="kv"><span><span class="dot approved"></span> ${t("approved")}</span><b>${H(sum(mine.filter(e=>e.status==="approved"),e=>e.hours))}</b></div>
            <div class="kv"><span><span class="dot pending"></span> ${t("awaiting")}</span><b>${H(sum(mine.filter(e=>e.status==="pending"),e=>e.hours))}</b></div>
            <div class="kv"><span><span class="dot rejected"></span> ${t("returned")}</span><b class="num">${returnedAll.length}</b></div>

        <div class="card"><div class="card-h"><h2>${t("plannedWeek")}</h2></div>
          <div class="card-b" style="padding-top:6px;padding-bottom:6px"><ul class="feed">${plan.map(a => { const act = sum(S.entries.filter(e => e.userId === u.id && e.projectId === a.projectId && weekOf(e.date) === THIS_WEEK && e.status !== "rejected"), e => e.hours); return `<li><span>${pLabel(proj(a.projectId))}</span><span class="num" style="font-size:13px">${r1(act)} / ${a.hours} ${t("h")}</span></li>`; }).join("") || `<li class="muted">${t("w_noPlan")}</li>`}</ul></div></div>
        <div class="card"><div class="card-h"><h2>${t("recent")}</h2></div>
          <div class="card-b" style="padding-top:6px;padding-bottom:6px"><ul class="feed">${decisions.map(e => `<li><span>${fmtDay(e.date)} · <span class="code">${esc(proj(e.projectId).code)}</span></span><span class="badge b-${e.status}">${r1(e.hours)} ${t("h")}</span></li>`).join("") || `<li class="muted">${t("noRecent")}</li>`}</ul></div></div>

function locSelect(){ return `<select class="input" id="ciLoc" aria-label="${t("a_loc")}">${["office","site","remote"].map(l => `<option value="${l}">${t("loc_"+l)}</option>`).join("")}</select>`; }
function attCard(u){
  const rec = attRec(u.id, TODAY);
  const onLeave = dayEntries(u.id, TODAY).some(e => e.projectId === "pl" && e.status !== "rejected");
  const past = openPast(u.id);
  const tags = [];
  if (isWeekend(TODAY)) tags.push(`<span class="tag">${t("weekendWork")}</span>`);
  if (onLeave) tags.push(`<span class="tag warn">${t("leaveTag")}</span>`);
  if (rec && dutyH(rec, TODAY) > 12) tags.push(`<span class="tag bad">${t("longShift")}</span>`);
  if (rec && rec.sessions.length > 1) tags.push(`<span class="tag">${t("sessionsN",{n:rec.sessions.length})}</span>`);
  let inner;
  if (!rec) inner = `<span class="big muted">--:--</span><div class="grow"><b>${t("attNotIn")}</b> ${tags.join(" ")}<div class="muted" style="font-size:13px">${onLeave ? t("leaveConflict") : `${t("workStart")} ${S.settings.workStart}`}</div></div>
    ${locSelect()}<button class="ci-btn" data-a="checkIn">${I.play}${t("checkIn")}</button>`;
  else if (isOpen(rec)) inner = `<span class="big" data-duty="${u.id}|${TODAY}">${dutyClock(u.id, TODAY)}</span><div class="grow"><b>${t("attIn",{t:rec.in, loc:t("loc_"+rec.loc)})}</b> ${isLate(rec) ? `<span class="tag warn">${t("late")}</span>` : `<span class="tag good">${t("onTime")}</span>`} ${tags.join(" ")}<div class="muted" style="font-size:13px">${t("a_onDuty")}</div></div>
    <button class="ci-btn out" data-a="checkOut">${I.stop}${t("checkOut")}</button>`;
  else inner = `<span class="big">${dutyH(rec, TODAY)} ${t("h")}</span><div class="grow"><b>${t("attOut",{in:rec.in, out:rec.out, h:dutyH(rec, TODAY)})}</b> ${tags.join(" ")}<div class="muted" style="font-size:13px">${rec.sessions.map(x => `${x.in}–${x.out || "…"}`).join(" · ")}</div></div>
    ${locSelect()}<button class="ci-btn out" data-a="checkIn">${I.play}${t("reCheckIn")}</button>`;
  const fix = past.map(d => { const r = attRec(u.id, d), last = r.sessions[r.sessions.length - 1];
    return `<form class="alert bad" data-form="fixOut" style="margin:0 0 12px">${I.warn}<span class="grow">${t("missedOut",{d:fmtDay(d)})} <span class="muted num">(${t("a_in")} ${last.in})</span></span>
      <input type="hidden" name="d" value="${d}"><input class="input sm" type="time" name="out" required style="width:auto" value="${String(Math.min(23, Math.floor(toM(last.in)/60) + 9)).padStart(2,"0")}:00"><button class="btn sm" type="submit">${t("setOut")}</button></form>`; }).join("");
  return `${fix}<div class="card mb"><div class="card-b att-card">${inner}</div></div>`;
}
const fmtMin = m => `${String(Math.floor(m/60)).padStart(2,"0")}:${String(m%60).padStart(2,"0")}`;
const dutyClock = (u, d) => fmtMin(dutyMin(attRec(u, d), d));

/* ================= attendance module ================= */
function vAttendance(own){
  const u = me(), people = own ? [u] : (u.role === "admin" ? S.users.filter(x => x.role !== "admin") : [u, ...teamOf(u)]);
  const m = UI.month, days = workdaysIn(m+"-01", monthEnd(m));
  const allDays = []; for (let d = parse(m+"-01"); iso(d) <= monthEnd(m); d = addDays(d, 1)) allDays.push(iso(d));
  const codes = people.map(x => ({x, c:Object.fromEntries(allDays.map(d => [d, attCode(x.id, d)]))}));
  // today
  const todayCodes = people.map(x => ({x, c:attCode(x.id, TODAY), rec:attRec(x.id, TODAY)}));
  const cnt = k => todayCodes.filter(r => r.c === k).length;
  const ins = todayCodes.filter(r => r.rec).map(r => toM(r.rec.in));
  const avgIn = ins.length ? Math.round(sum(ins, x => x) / ins.length) : 0;
  const hm = mm => `${String(Math.floor(mm/60)).padStart(2,"0")}:${String(mm%60).padStart(2,"0")}`;
  const todayTable = `<div class="card mb"><div class="card-h"><h2>${t("a_today")} · ${fmtDay(TODAY)}</h2></div><div class="scroll-x"><table class="t"><thead><tr><th>${t("person")}</th><th>${t("status")}</th><th>${t("a_in")}</th><th>${t("a_out")}</th><th class="r">${t("a_onDuty")}</th><th>${t("a_loc")}</th><th class="r">${t("a_logged")}</th></tr></thead><tbody>
    ${todayCodes.map(({x, c, rec}) => { const lg = sum(dayEntries(x.id, TODAY).filter(e => e.status !== "rejected"), e => e.hours); return `<tr class="click" data-a="openPerson" data-id="${x.id}" data-d="${TODAY}"><td><span style="display:flex;align-items:center;gap:8px">${avatar(x, true)}${personLink(x)}${openPast(x.id).length ? ` <span class="tag bad">${t("missedOutTag")}</span>` : ""}</span></td>
      <td>${c === "P" ? `<span class="tag good">${t("a_present")}</span>` : c === "L" ? `<span class="tag warn">${t("a_late")}</span>` : c === "V" ? `<span class="tag">${t("a_leave")}</span>` : c === "W" ? `<span class="tag">${t("weekend")}</span>` : toM(nowHM()) <= toM(S.settings.workStart) + S.settings.grace ? `<span class="tag">${t("notYet")}</span>` : `<span class="tag bad">${t("a_notyet")}</span>`}${rec && rec.sessions.length > 1 ? ` <span class="tag">${t("sessionsN",{n:rec.sessions.length})}</span>` : ""}</td>
      <td class="num">${rec ? rec.in : "—"}</td><td class="num">${rec ? (rec.out || `<span class="muted">${t("a_still")}</span>`) : "—"}</td>
      <td class="r num">${rec ? (rec.out ? dutyH(rec, TODAY) : `<span data-duty="${x.id}|${TODAY}">${dutyClock(x.id, TODAY)}</span>`) : "—"}</td><td>${rec ? t("loc_"+rec.loc) : "—"}</td><td class="r num">${r1(lg)}</td></tr>`; }).join("")}
  </tbody></table></div></div>`;
  // register
  const reg = `<div class="card mb"><div class="card-h"><div><h2>${t("a_register")} · ${fmtMonth(m)}</h2><div class="sub">${t("a_regSub")}</div></div>
    <div class="month-nav"><button class="btn sm" data-a="month" data-n="-1" aria-label="prev">${UI.lang==="ar"?I.next:I.prev}</button><button class="btn sm" data-a="month" data-n="1" aria-label="next" ${m >= THIS_MONTH ? "disabled" : ""}>${UI.lang==="ar"?I.prev:I.next}</button></div></div>
    <div class="scroll-x"><table class="t reg"><thead><tr><th>${t("person")}</th>${allDays.map(d => `<th class="num" ${isWeekend(d) ? 'style="opacity:.5"' : ""}>${parse(d).getDate()}</th>`).join("")}<th>${t("a_days")}</th><th>${t("a_lateN")}</th><th>${t("a_absN")}</th><th>${t("a_avgH")}</th></tr></thead><tbody>
    ${codes.map(({x, c}) => { const vals = Object.values(c); const recs = days.map(d => attRec(x.id, d)).filter(r => r && r.out);
      return `<tr><td>${personLink(x)}</td>${allDays.map(d => { const k = c[d], rec = attRec(x.id, d), miss = rec && isOpen(rec) && d < TODAY;
        const tip = `${esc(x.name)} · ${fmtDay(d)}<br>${rec ? rec.sessions.map(z => `${z.in} → ${z.out || t("a_still")}`).join("<br>") + ` · ${t("loc_"+rec.loc)}${miss ? `<br>${t("missedOutTag")}` : ""}${rec.corrected ? `<br>${t("corrected")}` : ""}` : k === "V" ? t("a_leave") : k === "A" ? t("a_absent") : ""}`;
        return `<td><button class="ac ${k} ${miss ? "miss" : ""} ${rec && rec.corrected ? "corr" : ""}" ${k === "W" || k === "F" ? "disabled" : ""} data-a="openPerson" data-id="${x.id}" data-d="${d}" data-tip="${k === "W" || k === "F" ? "" : esc(tip)}">${k === "W" ? "·" : k === "F" ? "" : k === "N" ? "–" : k}</button></td>`; }).join("")}
        <td class="num">${vals.filter(v => v === "P" || v === "L").length}</td><td class="num">${vals.filter(v => v === "L").length}</td><td class="num">${vals.filter(v => v === "A").length}</td><td class="num">${recs.length ? r1(sum(recs, r => dutyH(r, ""))/recs.length) : "—"}</td></tr>`; }).join("")}
    </tbody></table></div></div>`;
  // charts
  const rate = workdaysIn(m+"-01", m === THIS_MONTH ? TODAY : monthEnd(m)).map(d => {
    const pres = people.filter(x => ["P","L"].includes(attCode(x.id, d))).length, late = people.filter(x => attCode(x.id, d) === "L").length;
    return {label:fmtDay(d,{day:"numeric"}), segs:[{v:pres - late, c:"var(--accent)"}, {v:late, c:"var(--pending-mark)"}], tip:`${fmtDay(d)}<br>${t("a_present")}: <b>${pres}/${people.length}</b>${late ? `<br>${t("a_late")}: <b>${late}</b>` : ""}`};
  });
  const vsTs = people.filter(x => x.role === "engineer").map(x => {
    const dd = monthExpectedDays(m).concat(m === THIS_MONTH ? [] : []);
    const duty = sum(dd.map(d => attRec(x.id, d)).filter(r => r && r.out), r => dutyH(r, ""));
    const lg = sum(S.entries.filter(e => e.userId === x.id && e.date.startsWith(m) && e.date < TODAY && e.status !== "rejected" && e.projectId !== "pl"), e => e.hours);
    return {x, duty, lg};
  });
  return shell(`
    ${pageH(t(own ? "nav_myatt" : "attTitle"), own ? t("myAttSub") : t("attSub",{s:S.settings.workStart, g:S.settings.grace}))}
    ${own ? attCard(u) : `<div class="stats">
      ${statCard(t("a_present"), cnt("P") + cnt("L"), `/ ${people.length}`)}
      ${statCard(t("a_late"), cnt("L"), "", "", cnt("L") ? "warn" : "good")}
      ${statCard(t("a_leave"), cnt("V"))}
      ${statCard(t("a_notyet"), cnt("N"), "", "", cnt("N") ? "bad" : "good")}
      ${statCard(t("a_avgIn"), avgIn ? hm(avgIn) : "—")}
      ${statCard(t("missedOutTag"), people.filter(x => openPast(x.id).length).length, "", "", people.some(x => openPast(x.id).length) ? "bad" : "good")}
    </div>`}
    ${own ? "" : `<div class="grid g-2 mb">
      <div class="card"><div class="card-h"><div><h2>${t("a_rate")}</h2><div class="sub">${t("a_rateSub")}</div></div><div class="legend"><span><i class="swatch" style="background:var(--accent)"></i>${t("onTime")}</span><span><i class="swatch" style="background:var(--pending-mark)"></i>${t("a_late")}</span></div></div><div class="card-b">${columns(rate, {h:170, aria:t("a_rate")})}</div></div>
      <div class="card"><div class="card-h"><div><h2>${t("a_vsTs")}</h2><div class="sub">${t("a_vsTsSub")}</div></div></div><div class="card-b">${hbars(vsTs.map(({x, duty, lg}) => ({label:esc(x.name), v:lg, max:Math.max(duty, lg, 1), mark: duty ? 100 * duty / Math.max(duty, lg) : null, c: lg < duty * .85 ? "var(--pending-mark)" : "var(--accent)", right:`${Math.round(lg)}/${Math.round(duty)}<small>${t("a_gap")} ${Math.round(duty - lg)}</small>`, tip:`${esc(x.name)}<br>${t("a_onDuty")}: <b>${r1(duty)}</b><br>${t("a_logged")}: <b>${r1(lg)}</b>`})))}</div></div>
    </div>`}
    ${own ? "" : todayTable}
    ${reg}`);
}

/* ================= engineer: dashboard ================= */
function vMyDash(){
  const u = me(), m = THIS_MONTH;
  const mine = S.entries.filter(e => e.userId === u.id && e.date.startsWith(m));
  const comp = completeness([u], m);
  const work = mine.filter(e => e.status !== "rejected" && !proj(e.projectId).leave);
  const wd = new Set(work.map(e => e.date)).size;
  return shell(`
    ${pageH(t("myDashTitle"), t("myDashSub",{m:fmtMonth(m)}))}
    <div class="stats">
      ${statCard(t("k_approved"), r1(sum(mine.filter(e => e.status === "approved"), e => e.hours)), t("h"))}
      ${statCard(t("k_pending"), r1(sum(mine.filter(e => e.status === "pending"), e => e.hours)), t("h"))}
      ${statCard(t("k_logged"), comp.logged, "", t("k_ofExpected",{n:comp.expected}), comp.logged >= comp.expected ? "good" : "warn")}
      ${statCard(t("k_avg"), wd ? r1(sum(work, e => e.hours) / wd) : 0, t("h"), t("k_vsStd",{n:S.settings.stdDay}))}
      ${statCard(t("k_openT"), S.tickets.filter(x => x.assignee === u.id && x.status !== "done").length)}
    </div>

function flagsFor(eid, day, list){
  const f = [], max = S.settings.dailyMax;
  if (sum(dayEntries(eid, day).filter(e => e.status !== "rejected"), e => e.hours) > max) f.push(`<span class="tag bad">${t("overLimit",{n:max})}</span>`);
  if (isWeekend(day)) f.push(`<span class="tag warn">${t("weekendTag")}</span>`);
  if (list.some(e => e.hours >= 4 && !e.note && !e.ticketId && !proj(e.projectId).leave)) f.push(`<span class="tag warn">${t("noNoteTag")}</span>`);
  if (list.some(e => proj(e.projectId).leave)) f.push(`<span class="tag">${t("leaveTag")}</span>`);
  const work = sum(dayEntries(eid, day).filter(e => e.status !== "rejected" && !proj(e.projectId).leave), e => e.hours), rec = attRec(eid, day);
  if (work && !rec) f.push(`<span class="tag warn">${t("noCheckin")}</span>`);
  else if (rec && isOpen(rec) && day < TODAY) f.push(`<span class="tag warn">${t("missedOutTag")}</span>`);
  else if (rec && day < TODAY && work > dutyH(rec, day) + .5) f.push(`<span class="tag warn">${t("tsOverDuty",{a:r1(work), b:dutyH(rec, day)})}</span>`);
  return f;
}

function whereNow(x){
  const tm = S.timers[x.id];
  const today = dayEntries(x.id, TODAY).filter(e => e.status !== "rejected");
  if (tm) return {k:"live", tm};
  if (today.some(e => proj(e.projectId).leave)) return {k:"leave"};

  if (isWeekend(TODAY)) return {k:"weekend"};
  return {k:"none"};
}

function timelineInfo(p){
  if (!p.start || !p.end) return {pctv:0, txt:"—"};
  const total = Math.max(1, diffDays(p.start, p.end)), done = diffDays(p.start, TODAY);
  const pctv = Math.max(0, Math.min(100, done / total * 100));
  const txt = done < 0 ? t("notStarted",{d:fmtDate(p.start)}) : TODAY > p.end ? t("ended") : t("daysLeft",{n:diffDays(TODAY, p.end)});
  return {pctv, txt};
}

function burnPoints(p, f){
  const pts = [], back = 12;
  const appr = S.entries.filter(e => e.projectId === p.id && e.status === "approved");
  const firstTracked = iso(addDays(THIS_WEEK, -7 * back));
  const base = (p.opening || 0) * f.avgRate + sum(appr.filter(e => e.date < firstTracked), cost);
  const ahead = Math.min(40, Math.max(6, Math.ceil(f.weeksLeft) + 1));
  for (let w = back; w >= -ahead; w--) {
    const wk = iso(addDays(THIS_WEEK, -7 * w)), wkEnd = iso(addDays(wk, 6));
    const a = w >= 0 ? base + sum(appr.filter(e => e.date >= firstTracked && e.date <= wkEnd), cost) : null;
    const fc = w <= 0 ? f.actual + f.committed + f.weekly * Math.max(0, Math.min(f.weeksLeft, -w)) : null;
    const el = p.start && p.end ? Math.max(0, Math.min(1, diffDays(p.start, wkEnd) / Math.max(1, diffDays(p.start, p.end)))) : 0;
    const pl = p.budgetCost * el;
    pts.push({label:fmtDay(wk,{day:"numeric", month:"short"}), a, f:fc, p:pl, tip:`${fmtDay(wk)}<br>${t("plan")}: <b>${money(pl)}</b>${a != null ? `<br>${t("actual")}: <b>${money(a)}</b>` : ""}${fc != null && w < 0 ? `<br>${t("forecast")}: <b>${money(fc)}</b>` : ""}`});
  }
  return pts;
}

  if (rec && isOpen(rec)) { if (!auto) toast(t("alreadyIn")); return false; }
  if (rec) { const last = rec.sessions[rec.sessions.length - 1]; rec.sessions.push({in: toM(tm) < toM(last.out) ? last.out : tm, out:null, loc}); syncRec(rec); }

      const cur = sum(dayEntries(UI.userId, UI.day).filter(e => e.status !== "rejected"), e => e.hours);
      if (cur + sum(src, e => e.hours) > S.settings.dailyMax) { UI.err = t("limitHit",{n:S.settings.dailyMax}); return; }
      src.forEach(e => S.entries.push(newEntry(UI.day, e, e.hours, e.note))); save(); toast(t("copiedDay",{n:src.length}));
    },
    leave(){
      const cur = sum(dayEntries(UI.userId, UI.day).filter(e => e.status !== "rejected"), e => e.hours), h = S.settings.stdDay;
      if (cur + h > S.settings.dailyMax) { UI.err = t("limitHit",{n:S.settings.dailyMax}); return; }
      S.entries.push(newEntry(UI.day, {projectId:"pl"}, h, "")); save(); toast(t("added"));
    },
    submit(){
      const u = me(); const l = dayEntries(u.id, UI.day).filter(e => e.status === "draft");
      l.forEach(e => { e.status = "pending"; e.reason = null; e.at = TODAY; hist(e, "submitted"); });
      if (u.sup) notify(u.sup, "n_submitted", {eng:u.id, d:UI.day, n:r1(sum(l,e=>e.hours))});
      save(); toast(t("submitted",{name:user(u.sup).name}));
    },
    checkIn(){ doCheckIn($("#ciLoc")?.value || "office", false); },
    checkOut(){ doCheckOut(); },
    tTrack(){ if (S.timers[UI.userId]) stopTimer(true); startTimer(b.dataset.w, ""); },
    tStop(){ stopTimer(true); },
    tDiscard(){ stopTimer(false); },
    apprGroup(){ const [eid, day] = b.dataset.k.split("|"); approveEntries(dayEntries(eid, day).filter(e => e.status === "pending")); UI.rejecting = null; },
    apprOne(){ approveEntries(S.entries.filter(x => x.id === id)); },
    apprAll(){
      const ids = new Set(teamOf(me()).map(x => x.id)), groups = {};
      S.entries.filter(e => ids.has(e.userId) && e.status === "pending").forEach(e => (groups[e.userId+"|"+e.date] ||= []).push(e));
      approveEntries(Object.entries(groups).filter(([k, g]) => { const [eid, day] = k.split("|"); return !flagsFor(eid, day, g).some(f => f.includes("bad")); }).flatMap(([,g]) => g));
    },
    rejStart(){ UI.rejecting = {key:b.dataset.k, id:id || null}; UI.err = ""; },
    rejCancel(){ UI.rejecting = null; UI.err = ""; },
    remind(){ notify(id, "n_remind", {by:UI.userId, d:missingDays(id, 7)[0]}); save(); toast(t("reminded",{name:user(id).name})); return "stay"; },
    whereView(){ UI.whereView = b.dataset.v; },
    openProject(){ if (UI.view !== "project") UI.back = UI.view; UI.projectId = id; UI.view = "project"; UI.editProj = false; UI.err = ""; window.scrollTo(0,0); },
    openPerson(){ if (!canSeePerson(id)) return; if (UI.view !== "person") UI.back = ["project","ticket"].includes(UI.view) ? UI.back : UI.view; UI.personId = id; UI.personDay = b.dataset.d || TODAY; if (b.dataset.d) UI.month = b.dataset.d.slice(0,7); UI.attEdit = null; UI.view = "person"; window.scrollTo(0,0); },
    openTicket(){ if (UI.view !== "ticket") UI.back = ["project","person"].includes(UI.view) ? UI.back : UI.view; UI.ticketId = id; UI.view = "ticket"; window.scrollTo(0,0); },
    personDay(){ UI.personDay = b.dataset.d; UI.attEdit = null; UI.err = ""; },
    attEditStart(){ const r = attRec(b.dataset.u, b.dataset.d); UI.attEdit = {u:b.dataset.u, d:b.dataset.d, sessions: r ? r.sessions.map(z => ({...z})) : [{in:S.settings.workStart, out:"", loc:"office"}]}; UI.err = ""; },
    attEditCancel(){ UI.attEdit = null; UI.err = ""; },
    attSessAdd(){ captureAttEdit(); const ss = UI.attEdit.sessions, last = ss[ss.length - 1]; ss.push({in: last && last.out ? last.out : "13:00", out:"", loc: last ? last.loc : "office"}); },
    attSessDel(){ captureAttEdit(); UI.attEdit.sessions.splice(Number(b.dataset.n), 1); },
    newTicketHere(){ UI.tf = {p:id, a:"", mine:false}; UI.newTicket = true; UI.back = null; UI.view = me().role === "engineer" ? "mytickets" : "tickets"; window.scrollTo(0,0); },
    removeMember(){ const p = proj(UI.projectId); p.members = (p.members || []).filter(m => m.userId !== id); S.allocs = S.allocs.filter(a => !(a.projectId === p.id && a.userId === id && a.week >= THIS_WEEK)); save(); toast(t("memberRemoved",{name:user(id).name, code:p.code})); },
    newProjToggle(){ UI.newProj = !UI.newProj; UI.err = ""; },
    editProj(){ UI.editProj = true; UI.err = ""; },
    editProjCancel(){ UI.editProj = false; UI.err = ""; },
    toggleProj(){ const p = S.projects.find(x => x.id === id); p.active = !p.active; save(); },
    ticketsFor(){ UI.tf = {p:id, a:"", mine:false}; UI.view = me().role === "engineer" ? "mytickets" : "tickets"; },
    newTicketToggle(){ UI.newTicket = !UI.newTicket; UI.err = ""; },
    tkMove(){ const x = ticket(id), order = ["todo","doing","review","done"]; x.status = order[Math.max(0, Math.min(3, order.indexOf(x.status) + Number(b.dataset.n)))]; save(); toast(t("moved",{s:t("ts_"+x.status)})); },
    rpSel(){ UI.rpSel = {u:b.dataset.u, w:b.dataset.w}; },
    rpNav(){ UI.rpStart = iso(addDays(UI.rpStart, 7 * Number(b.dataset.n))); },
    rpDel(){ S.allocs = S.allocs.filter(x => x.id !== id); save(); toast(t("rpSaved")); },
    rpCopy(){ const {u, w} = UI.rpSel, nw = iso(addDays(w, 7)); S.allocs = S.allocs.filter(x => !(x.userId === u && x.week === nw)); S.allocs.filter(x => x.userId === u && x.week === w).forEach(x => S.allocs.push({...x, id:uid(), week:nw})); UI.rpSel = {u, w:nw}; save(); toast(t("rpCopied")); },
    month(){ const d = parse(UI.month + "-01"); d.setMonth(d.getMonth() + Number(b.dataset.n)); UI.month = iso(d).slice(0,7); },
    closeMonth(){ S.settings.closed.push(UI.month); S.users.filter(u => u.role !== "admin").forEach(u => notify(u.id, "n_closed", {by:UI.userId, m:UI.month})); save(); toast(t("closedOk",{m:fmtMonth(UI.month)})); },
    reopen(){ S.settings.closed = S.settings.closed.filter(x => x !== UI.month); save(); toast(t("reopened",{m:fmtMonth(UI.month)})); },
    csv(){
      const d = monthData(UI.month); const rows = [["Company","Month","Person","Project code","Project","Client","Billable","Approved hours","Cost (SAR)"]];
      Object.entries(d.mat).forEach(([k,v]) => { const [u,p] = k.split("|"); rows.push([S.settings.company, UI.month, user(u).name, proj(p).code, proj(p).name, proj(p).client || "", proj(p).billable ? "Yes" : "No", r1(v), Math.round(v * (user(u).rate||0))]); });
      const txt = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
      navigator.clipboard.writeText(txt).then(() => toast(t("copied")), () => toast(t("copyFail"))); return "stay";
    },
    reset(){ S = seed(); save(); UI.rpSel = null; toast(t("resetDone")); },
  };
  if (A[a] && A[a]() !== "stay") render();
});
function captureAttEdit(){ const f = document.querySelector("[data-form=attEdit]"); if (!f || !UI.attEdit) return; const fd = new FormData(f); const ins = fd.getAll("in"), outs = fd.getAll("out"), locs = fd.getAll("loc"); UI.attEdit.sessions = ins.map((v, i) => ({in:v, out:outs[i], loc:locs[i]})); }
document.addEventListener("keydown", ev => { if ((ev.key === "Enter" || ev.key === " ") && ev.target.matches(".side a[data-a]")) { ev.preventDefault(); ev.target.click(); } });

document.addEventListener("input", ev => { const el = ev.target; if (el.dataset.whatif) { const l = document.querySelector("label[for=wi] b"); if (l) l.textContent = (el.value > 0 ? "+" : "") + el.value + "%"; } });
document.addEventListener("change", ev => {
  const el = ev.target;
  if (el.dataset.whatif) { (UI.whatIf ||= {})[el.dataset.whatif] = Number(el.value); const pos = window.scrollY; render(); window.scrollTo(0, pos); return; }
  if (el.dataset.f) { UI.tf[el.dataset.f] = el.value; render(); return; }
  if (el.hasAttribute("data-tkproj")) { const a = el.form.querySelector("[name=a]"); if (a && !a.disabled) a.innerHTML = assigneeOpts(el.value, ""); return; }
  if (el.dataset.tkf) { const k = ticket(UI.ticketId); if (!k) return; const f = el.dataset.tkf; let v = el.value;
    if (f === "est") v = Math.max(1, parseInt(v, 10) || k.est);
    if (f === "due" && !v) return;
    if (k[f] === v) return; k[f] = v; (k.log ||= []).push({a:f, by:UI.userId, at:new Date().toISOString(), v});
    if (f === "assignee") { ensureMember(v, k.projectId); if (v !== UI.userId) notify(v, "n_ticket", {by:UI.userId, key:k.key, title:k.title}); }
    save(); toast(t("ticketSaved")); render(); return; }
  if (el.dataset.alloc) { const x = S.allocs.find(a => a.id === el.dataset.alloc); const v = Math.max(0, Math.min(80, parseInt(el.value, 10) || 0)); if (v) x.hours = v; else S.allocs = S.allocs.filter(a => a !== x); save(); toast(t("rpSaved")); render(); return; }
  const tf = el.closest("[data-form=timer]"); if (tf) { UI.tSel = tf.w.value; UI.tNote = tf.n.value; return; }
  if (!el.dataset.a2) return;
  const u = user(el.dataset.id);
  if (el.dataset.a2 === "setSup") u.sup = el.value || null;
  if (el.dataset.a2 === "setRole") { u.role = el.value; if (u.role !== "engineer") delete u.sup; }
  if (el.dataset.a2 === "setRate") u.rate = Math.max(0, parseFloat(el.value) || 0);
  save(); toast(t("saved")); render();
});

document.addEventListener("submit", ev => {
  const f = ev.target.closest("[data-form]"); if (!f) return;
  ev.preventDefault();
  const fd = new FormData(f), kind = f.dataset.form, g = k => String(fd.get(k) ?? "").trim();
  UI.err = "";
  if (kind === "timer"){ if (!startTimer(g("w"), g("n"))) return; UI.tSel = ""; UI.tNote = ""; }
  if (kind === "entry"){
    const sel = parseWork(g("w")), hrs = r1(parseFloat(g("h").replace(",", ".")) || 0);
    if (!sel) { UI.err = t("needProject"); return render(); }
    if (hrs <= 0) { UI.err = t("needHours"); return render(); }
    const other = sum(dayEntries(UI.userId, UI.day).filter(e => e.status !== "rejected" && e.id !== UI.editing), e => e.hours);
    if (other + hrs > S.settings.dailyMax) { UI.err = t("limitHit",{n:S.settings.dailyMax}); return render(); }
    if (UI.editing) { const e = S.entries.find(x => x.id === UI.editing); Object.assign(e, {projectId:sel.projectId, ticketId:sel.ticketId||null, hours:hrs, note:g("n"), status:"draft", reason:null}); hist(e, "edited"); UI.editing = null; }
    else S.entries.push(newEntry(UI.day, sel, hrs, g("n")));
    save(); toast(t("added"));
  }
  if (kind === "reject"){
    const reason = g("r");
    if (!reason) { UI.err = t("needReason"); return render(); }
    const {key, id} = UI.rejecting; const [eid, day] = key.split("|");
    const l = id ? S.entries.filter(e => e.id === id) : dayEntries(eid, day).filter(e => e.status === "pending");
    l.forEach(e => { e.status = "rejected"; e.reason = reason; e.by = UI.userId; e.dAt = TODAY; hist(e, "rejected", reason); });
    notify(eid, "n_returned", {by:UI.userId, d:day, reason});
    UI.rejecting = null; save(); toast(t("returnedToast",{name:user(eid).name}));
  }
  if (kind === "limits"){
    const c = g("co"), mx = parseFloat(g("max")), sd = parseFloat(g("std")), bd = parseInt(g("bd"), 10);
    if (c) S.settings.company = c.slice(0, 40);
    if (mx >= 1 && mx <= 24) S.settings.dailyMax = mx;
    if (sd >= 1 && sd <= 12) S.settings.stdDay = sd;
    if (bd >= 0 && bd <= 31) S.settings.backdays = bd;
    if (/^\d\d:\d\d$/.test(g("ws"))) S.settings.workStart = g("ws");
    const gr = parseInt(g("gr"), 10); if (gr >= 0 && gr <= 120) S.settings.grace = gr;
    save(); toast(t("saved"));
  }
  if (kind === "person"){
    const name = g("name"); if (!name) { UI.err = t("needName"); return render(); }
    const role = g("role"); const p = {id:uid(), name, title:g("title") || t("role_"+role), role, rate:Math.max(0, parseFloat(g("rate")) || 0)};
    if (role === "engineer") p.sup = g("sup") || null;
    S.users.push(p); save(); toast(t("personAdded"));
  }
  if (kind === "project" || kind === "projEdit"){
    const code = g("code").toUpperCase(), name = g("name"), start = g("start"), end = g("end");
    if (!code || !name) { UI.err = t("needCode"); return render(); }
    if (start && end && end <= start) { UI.err = t("needDates"); return render(); }
    const data = {name, client:g("client"), manager:g("manager"), start, end, budgetHours:Math.max(0, parseInt(g("bh"),10)||0), budgetCost:Math.max(0, parseInt(g("bc"),10)||0), opening:Math.max(0, parseInt(g("op"),10)||0), billable:g("bill") === "1"};
    if (kind === "project") {
      if (S.projects.some(p => p.code === code)) { UI.err = t("dupCode"); return render(); }
      const np = {id:uid(), code, active:true, ...data};
      S.projects.splice(S.projects.length - 2, 0, np);
      UI.newProj = false; UI.projectId = np.id; UI.view = "project";
      toast(t("projectAdded",{code}));
    } else { Object.assign(proj(UI.projectId), data); UI.editProj = false; toast(t("saved")); }
    save();
  }
  if (kind === "ticket"){
    const title = g("title"), pid = g("p");
    if (!title || !pid) { UI.err = t("needTitle"); return render(); }
    const p = proj(pid), prefix = p.code.split("-")[0];
    const n = Math.max(100, ...S.tickets.filter(x => x.key.startsWith(prefix+"-")).map(x => parseInt(x.key.split("-")[1], 10) || 0)) + 1;
    const tk = {id:uid(), key:`${prefix}-${n}`, projectId:pid, title, desc:"", comments:[], log:[{a:"created", by:UI.userId, at:new Date().toISOString()}], assignee:g("a") || UI.userId, status:"todo", priority:g("pr") || "normal", due:g("due") || iso(addDays(new Date(), 7)), est:Math.max(1, parseInt(g("est"),10)||8), created:TODAY, by:UI.userId};
    S.tickets.push(tk); ensureMember(tk.assignee, pid);
    if (tk.assignee !== UI.userId) notify(tk.assignee, "n_ticket", {by:UI.userId, key:tk.key, title:tk.title});
    UI.newTicket = false; save(); toast(t("ticketAdded",{key:tk.key}));
  }
  if (kind === "emailIn"){
    const email = g("email").toLowerCase(); UI.authEmail = email;
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { UI.authErr = t("au_badEmail"); return render(); }
    const u = S.users.find(x => (x.email || demoEmail(x)) === email);
    if (!u) { UI.authErr = t("au_noAcc"); return render(); }
    UI.authErr = ""; UI.userId = u.id; UI.view = null; UI.day = TODAY; UI.month = THIS_MONTH; saveUI(); window.scrollTo(0,0);
  }
  if (kind === "signup"){
    const name = g("name"), email = g("email").toLowerCase(), dom = "dtera.com";
    if (!name) { UI.authErr = t("needName"); return render(); }
    if (!email.endsWith("@" + dom)) { UI.authErr = t("au_domain",{d:dom}); return render(); }
    if (S.users.some(x => (x.email || demoEmail(x)) === email) || S.requests.some(x => x.email === email)) { UI.authErr = t("au_dup"); return render(); }
    const r = {id:uid(), name, email, dept:g("dept"), role:g("role"), sup:g("sup"), at:new Date().toISOString()};
    S.requests.push(r); S.users.filter(x => x.role === "admin").forEach(x => notify(x.id, "n_request", {eng:"", name}));
    UI.authErr = ""; UI.reqSent = name; save();
  }
  if (kind === "member"){
    const p = proj(UI.projectId), uid_ = g("u"), h = Math.max(0, Math.min(60, parseInt(g("h"), 10) || 0)), from = g("from") || TODAY, to = g("to") || p.end || "";
    if (!uid_) { UI.err = t("pickPerson"); return render(); }
    if (isMember(uid_, p.id)) { UI.err = t("alreadyMember"); return render(); }
    if (to && to < from) { UI.err = t("needDates"); return render(); }
    (p.members ||= []).push({userId:uid_, role:g("role") || user(uid_).title, hours:h, from, to});
    let n = 0;
    if (h) for (let w = 0; w < 12; w++) { const wk = iso(addDays(THIS_WEEK, 7*w)); if (iso(addDays(wk, 6)) < from || (to && wk > to)) continue; if (S.allocs.some(a => a.userId === uid_ && a.projectId === p.id && a.week === wk)) continue; S.allocs.push({id:uid(), userId:uid_, projectId:p.id, week:wk, hours:h}); n++; }
    notify(uid_, "n_ticket", {by:UI.userId, key:p.code, title:p.name});
    save(); toast(t("memberAdded",{name:user(uid_).name, code:p.code, n}));
  }
  if (kind === "tkDesc"){ const k = ticket(UI.ticketId); k.desc = g("desc"); save(); toast(t("descSaved")); }
  if (kind === "tkComment"){ const k = ticket(UI.ticketId), text = g("text"); if (!text) return; (k.comments ||= []).push({by:UI.userId, at:new Date().toISOString(), text}); if (k.assignee !== UI.userId) notify(k.assignee, "n_ticket", {by:UI.userId, key:k.key, title:"💬 " + text.slice(0, 60)}); save(); toast(t("commentAdded")); }
  if (kind === "fixOut"){
    const d = g("d"), out = g("out"), rec = attRec(UI.userId, d); if (!rec) return render();
    const last = rec.sessions[rec.sessions.length - 1];
    if (!/^\d\d:\d\d$/.test(out) || toM(out) <= toM(last.in)) { toast(t("outBeforeIn",{t:last.in})); return; }
    last.out = out; syncRec(rec); rec.corrected = true;
    (rec.log ||= []).push({at:new Date().toISOString(), by:UI.userId, note:"Self-reported check-out " + out});
    const u = me(); if (u.sup) notify(u.sup, "n_fixout", {eng:u.id, d});
    save(); toast(t("fixedOut",{d:fmtDay(d), name:user(u.sup).name}));
  }
  if (kind === "attEdit"){
    const {u, d} = UI.attEdit, reason = g("reason");
    if (!reason) { UI.err = t("reasonReq"); return render(); }
    const ins = fd.getAll("in"), outs = fd.getAll("out"), locs = fd.getAll("loc");
    const sessions = ins.map((v, i) => ({in:v, out:outs[i] || null, loc:locs[i] || "office"})).filter(x => x.in);
    const bad = sessions.some((x, i) => (x.out && toM(x.out) <= toM(x.in)) || (i > 0 && sessions[i-1].out && toM(x.in) < toM(sessions[i-1].out)) || (!x.out && (i < sessions.length - 1 || d < TODAY)));
    if (bad) { UI.err = t("badTimes"); return render(); }
    const day = (S.att[u] ||= {}), prev = day[d];
    const before = prev ? prev.sessions.map(x => `${x.in}-${x.out||"…"}`).join(", ") : "—";
    if (!sessions.length) delete day[d];
    else { const rec = day[d] = syncRec({sessions, log:(prev && prev.log) || [], corrected:true}); rec.log.push({at:new Date().toISOString(), by:UI.userId, note:reason, before, after:sessions.map(x => `${x.in}-${x.out||"…"}`).join(", ")}); }
    if (u !== UI.userId) notify(u, "n_corr", {by:UI.userId, d});
    UI.attEdit = null; save(); toast(t("corrSaved"));
  }
  if (kind === "alloc"){
    const {u, w} = UI.rpSel, h = Math.max(1, Math.min(80, parseInt(g("h"),10) || 0));
    if (g("p")) { S.allocs.push({id:uid(), userId:u, projectId:g("p"), week:w, hours:h}); if (!ensureMember(u, g("p"))) toast(t("rpSaved")); save(); }
  }
  render();
});

render();
})();
